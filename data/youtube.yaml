# YouTube channels and playlists in the YouTube folder (/youtube/), in display order. Each card shows the latest
# video from feed (the channel's or playlist's RSS, read at build time, so the 6-hourly deploy keeps it current).
# @handle and /c/ URLs don't work in the feed URL, so it takes the channel id (the channel page's canonical link).
# thumb: a recent video's thumbnail, shown when YouTube's feed fails, as it often does with a 404.
