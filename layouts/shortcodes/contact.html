{{- /* Contact form, posted to un-static.com (its success redirect is set there). The mail-form markup is laid out
       by the deskbar theme, as a compose window in the shell and as a plain form without JS. */ -}}
<form class="mail-form" method="post" action="https://forms.un-static.com/forms/b3a094319063b3a8e52fe0e175dd796ace8b8624">
  <p class="mail-row"><span class="mail-l">To</span><span>Sam McLeod</span></p>
  <p class="mail-row"><label class="mail-l" for="name">Name</label><input id="name" name="name" type="text" autocomplete="name" placeholder="Your name" required></p>
  <p class="mail-row"><label class="mail-l" for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" placeholder="Your email address" required></p>
  <label class="mail-l mail-msg-l" for="message">Message</label>
  <textarea id="message" name="message" rows="10" placeholder="No sales or marketing messages please" required></textarea>
  <p class="mail-send"><button name="submit" type="submit">Send</button></p>
</form>
