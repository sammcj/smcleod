<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Stopwatch</title>
<style>body{font:16px system-ui;margin:2em;background:#fbfaf6;color:#222}</style></head>
<body><h1>Stopwatch</h1><p>A standalone file with no tool page. <output id="t">0</output>s</p>
<script>let s=0;setInterval(()=>{t.textContent=++s},1000)</script></body></html>
