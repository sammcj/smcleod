# Playlist for the Chiptunes player (layout: chiptunes, window: chiptunes). A site's own data/chiptunes.yaml
# replaces this one. Each track has a title, an optional credit, and one of:
# - song: song data the player synthesises live (format in assets/js/deskbar/lazy/chiptunes.js). An assets/ path
#   is published with the page; anything else is used as a URL.
# - url: a rendered audio file hosted outside the site's git history, such as a GitHub Release asset. Hosts that
#   send CORS headers also drive the visualiser.
tracks:
  - title: Carburettor Cruise
    song: chiptunes/carburettor-cruise.json
  - title: Pixel Picnic
    song: chiptunes/pixel-picnic.json
  - title: Cat Nap Cartridge
    song: chiptunes/cat-nap-cartridge.json
  - title: Flinders Street Shuffle
    song: chiptunes/flinders-street-shuffle.json
