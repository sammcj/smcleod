# Emblems for generated post thumbnails (layouts/_partials/deskbar/thumb-art.html), in the style of Haiku's vector
# icons: one object on a 64 unit grid, lit from the top-left, depth receding up and to the right, standing on y=57.
# defs holds the object's gradients; body is drawn with these classes, which thumb-art.html sizes per variant:
#   o  outline (thicker in the mini icon so edges survive at 20-32px)    t  thin outline
#   o3, o5  the dark stroke behind a 3 or 5 unit wide stroke             d  fine detail, left out of the mini icon
# Ids must not clash with the card's own: bg, sh.
neural:
  defs: >-
    <linearGradient id="glass" x2="0.5" y2="1"><stop stop-color="#e4f0fb" stop-opacity="0.92"/><stop offset="1" stop-color="#8fb6de" stop-opacity="0.8"/></linearGradient><radialGradient id="sb" cx="0.35" cy="0.3" r="0.8"><stop stop-color="#e6f1fc"/><stop offset="0.45" stop-color="#8db6e3"/><stop offset="1" stop-color="#2d5e98"/></radialGradient><radialGradient id="sa" cx="0.35" cy="0.3" r="0.8"><stop stop-color="#fff6d0"/><stop offset="0.45" stop-color="#ffd257"/><stop offset="1" stop-color="#d38708"/></radialGradient>
  body: |-
    <g transform="translate(0 4.5)">
    <rect x="30" y="7" width="26" height="30" rx="1.5" fill="url(#glass)" stroke="#27507f" class="o"/>
    <path class="d" d="M31.2 35V8.2H54.5" stroke="#fff" stroke-opacity=".7" stroke-width=".8" fill="none"/><circle cx="43" cy="14" r="2.5" fill="url(#sb)" stroke="#1b3656" class="t"/><circle cx="43" cy="22" r="3.2" fill="url(#sa)" stroke="#7a4d04" class="t"/><circle cx="43" cy="30" r="2.5" fill="url(#sb)" stroke="#1b3656" class="t"/><path class="d" d="M43 14L32 22M43 14L32 30M43 14L32 38M43 22L32 22M43 22L32 30M43 22L32 38M43 30L32 22M43 30L32 30M43 30L32 38" stroke="#2a4d75" stroke-opacity=".5" stroke-width=".8"/><path d="M43 22L32 22" stroke="#d98a06" stroke-width="1.8"/><rect x="19" y="15" width="26" height="30" rx="1.5" fill="url(#glass)" stroke="#27507f" class="o"/>
