<!doctype html>
<html lang="en-AU" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>smcleod.net - Deskbar Classic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root {
  --panel-h: 30px; --tab-h: 24px; --dock-h: 72px;
  --ui: 'Noto Sans', system-ui, sans-serif; --serif: 'Source Serif 4', Georgia, serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
  --panel: linear-gradient(#484b50, #36393d); --panel-fg: #ececec; --panel-hover: rgba(255,255,255,.1);
  --frame: #d8d8d8; --frame-hi: #fff; --frame-lo: #989898; --frame-dk: #626262;
  --tab: #ffcb00; --tab-hi: #fff4b8; --tab-lo: #b89200; --tab-dim: #f1de8c; --tab-in: #e6dcb4; --tab-in-lo: #b3a878; --tab-in-fg: #4d4a40;
  --content: #fff; --fg: #1f1f1f; --muted: #626262; --line: #d4d4d4; --zebra: rgba(0,0,0,.028);
  --accent: #3467b8; --accent-fg: #fff; --side: #eeeeec;
  --read-bg: #fbfaf6; --read-fg: #232323; --code-bg: #f1efe7; --rd-size: 18px;
  --wall: radial-gradient(1100px 650px at 80% 110%, rgba(255,203,0,.16), transparent 62%),
    repeating-radial-gradient(circle at 80% 118%, rgba(255,255,255,.05) 0 1px, transparent 1px 36px),
    linear-gradient(165deg, #45709e 0%, #2b4b72 46%, #1b304c 100%);
}
[data-theme=dark] {
  --frame: #46494d; --frame-hi: #62666b; --frame-lo: #2c2e31; --frame-dk: #17181a;
  --tab: #e9b900; --tab-hi: #f7d95c; --tab-lo: #8d7100; --tab-dim: #9c8a45; --tab-in: #5a5340; --tab-in-lo: #3a3527; --tab-in-fg: #d8d4c6;
  --content: #26282b; --fg: #e3e3e3; --muted: #a2a2a2; --line: #3a3d41; --zebra: rgba(255,255,255,.03);
  --accent: #4a82d8; --side: #2e3033;
  --read-bg: #1f2123; --read-fg: #dddcd8; --code-bg: #2a2c2f;
  --wall: radial-gradient(1100px 650px at 80% 110%, rgba(255,203,0,.09), transparent 62%),
    repeating-radial-gradient(circle at 80% 118%, rgba(255,255,255,.035) 0 1px, transparent 1px 36px),
    linear-gradient(165deg, #243a55 0%, #172739 50%, #0e1826 100%);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { font: 13px/1.4 var(--ui); color: var(--fg); background: var(--wall); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, select { font: inherit; color: var(--fg); background: var(--content); border: 1px solid var(--frame-lo); border-radius: 3px; padding: 3px 7px; min-height: 26px; user-select: text; -webkit-user-select: text; }
input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; }
.ico { display: inline-flex; width: 18px; height: 18px; flex: none; }
.ico svg { width: 100%; height: 100%; }
.grow { flex: 1; }
body.dragging, body.dragging * { cursor: grabbing !important; }
body.dragging iframe { pointer-events: none; }

/* XFCE top panel */
#panel { position: fixed; inset: 0 0 auto 0; height: var(--panel-h); z-index: 100000; display: flex; align-items: center; gap: 4px; padding: 0 6px; background: var(--panel); color: var(--panel-fg); border-bottom: 1px solid #1d1f22; box-shadow: 0 1px 0 rgba(255,255,255,.06) inset; }
.pb { display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 3px; white-space: nowrap; }
.pb:hover, .pb.open { background: var(--panel-hover); }
.pb svg { width: 18px; height: 18px; }
#menuBtn, #homeBtn { font-weight: 700; }
#homeBtn { border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.05); }
.pb:active, #homeBtn:active, #homeBtn.on { background: rgba(0,0,0,.38); box-shadow: inset 0 1px 2px rgba(0,0,0,.5); }
.pb:focus-visible { outline: 2px solid var(--tab); outline-offset: -2px; }
#tasks { display: flex; gap: 3px; min-width: 0; overflow: hidden; margin-left: 8px; }
.task { display: flex; align-items: center; gap: 6px; height: 24px; max-width: 210px; padding: 0 8px; border-radius: 3px; border: 1px solid transparent; }
.task span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task:hover { background: var(--panel-hover); }
.task.on { background: rgba(0,0,0,.35); border-color: rgba(0,0,0,.4); box-shadow: inset 0 1px 2px rgba(0,0,0,.4); }
.task.min { opacity: .6; font-style: italic; }
.task .ico { width: 16px; height: 16px; }
#winsBtn { display: none; }
#winsBtn b { background: var(--tab); color: #222; border-radius: 8px; padding: 0 6px; font-size: 11px; }
#clock { padding: 0 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
#clock b { font-weight: 600; margin-left: 6px; }

/* bottom dock panel */
#dock { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 100000; display: flex; gap: 4px; padding: 5px 6px; background: rgba(42,44,48,.88); border: 1px solid rgba(255,255,255,.12); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.35); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.dk { position: relative; width: 46px; height: 46px; display: grid; place-items: center; border-radius: 6px; }
.dk:hover { background: rgba(255,255,255,.12); }
.dk .ico { width: 34px; height: 34px; }
.dk.run::after { content: ''; position: absolute; bottom: 1px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--tab); }

/* desktop */
#desk { position: fixed; inset: var(--panel-h) 0 0 0; }
#desk::after { content: 'smcleod.net'; position: absolute; right: 36px; bottom: calc(var(--dock-h) + 20px); font: 700 46px/1 var(--ui); letter-spacing: -1px; color: rgba(255,255,255,.07); pointer-events: none; }
#icons { position: absolute; top: 16px; left: 10px; display: grid; gap: 6px; z-index: 1; }
.dicon { width: 92px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 2px; border-radius: 4px; }
.dicon .ico { width: 42px; height: 42px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
.dicon span { color: #fff; font-size: 12px; text-align: center; padding: 1px 5px; border-radius: 2px; text-shadow: 0 1px 2px #000; }
.dicon.sel span { background: var(--accent); text-shadow: none; }
#snapPreview { position: absolute; z-index: 99980; background: rgba(52,103,184,.22); border: 2px solid rgba(120,170,240,.85); border-radius: 4px; pointer-events: none; transition: all .12s ease-out; }
#divider { position: absolute; top: 0; width: 14px; z-index: 99970; cursor: col-resize; touch-action: none; }
#divider::after { content: ''; position: absolute; left: 5px; top: 50%; width: 4px; height: 56px; margin-top: -28px; border-radius: 2px; background: var(--tab); box-shadow: 0 0 0 1px rgba(0,0,0,.45); }
#divider:hover::after, body.dragging #divider::after { height: 96px; margin-top: -48px; }

/* Recent posts widget: a Haiku replicant-style desktop panel, beside the icon column (icons end at 102px) */
#recent { position: absolute; top: 16px; left: 124px; width: 360px; z-index: 1; }
#recent h2 { display: inline-flex; align-items: center; gap: 6px; margin: 0; padding: 2px 4px 2px 10px; font-size: 12px; background: var(--tab); color: #1f1f1f; border: 1px solid var(--frame-dk); border-bottom: 0; }
#recentList { background: var(--frame); border: 1px solid var(--frame-dk); box-shadow: inset 1px 1px 0 var(--frame-hi), 0 8px 24px rgba(0,0,0,.3); padding: 4px; }
.rp { display: flex; gap: 10px; width: 100%; padding: 8px; text-align: left; background: var(--content); border: 1px solid var(--line); margin-bottom: 4px; border-radius: 2px; }
.rp:hover { border-color: var(--accent); }
.rp .rp-img, .rp .pc-tile { width: 72px; height: 54px; flex: none; }
.rp-img { object-fit: cover; border: 1px solid var(--line); background: var(--side); }
.rp-t { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.rp-t b { font-size: 13px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rp-t small { color: var(--muted); font-size: 11px; }
.rp-d { font-size: 12px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rp-all { width: 100%; justify-content: center; }

/* Haiku windows */
.win { position: absolute; min-width: 280px; min-height: 160px; }
.tabs { position: absolute; left: 0; right: 0; bottom: 100%; height: var(--tab-h); pointer-events: none; }
.ghost, .ghost * { pointer-events: none !important; }
.ghost { opacity: .9; }
.tab { pointer-events: auto; position: absolute; bottom: 0; height: var(--tab-h); max-width: 100%; display: flex; align-items: center; gap: 8px; padding: 0 6px; background: var(--tab-in); color: var(--tab-in-fg); border: 1px solid var(--frame-dk); border-bottom: 0; box-shadow: inset 1px 1px 0 rgba(255,255,255,.35), inset -1px 0 0 var(--tab-in-lo); cursor: default; touch-action: none; white-space: nowrap; transition: background-color .15s, color .15s, box-shadow .15s; }
.win.active .tab { background: var(--tab); color: #1f1f1f; box-shadow: inset 1px 1px 0 var(--tab-hi), inset -1px 0 0 var(--tab-lo); }
.win.active .tab:not(.on) { background: var(--tab-dim); }
.win:not(.active) .tab .tt { font-weight: 600; }
.tabs.multi { display: flex; }
.tabs.multi .tab { position: relative; flex: 1 1 0; min-width: 0; margin-right: -1px; }
.tab .tt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: 700; font-size: 12px; max-width: 42ch; }
.tab.sliding { background: #ffe066 !important; cursor: ew-resize; box-shadow: inset 0 0 0 2px var(--accent); }
.tab.drop { box-shadow: inset 0 0 0 2px var(--accent), 0 0 0 2px var(--accent); }
.tab { gap: 2px; padding-right: 2px; }
.tab .tt { margin-right: 6px; }
.ctl { width: 20px; height: 20px; flex: none; display: grid; place-items: center; border-radius: 3px; color: #3a3000; transition: background-color .15s, color .15s; }
.ctl svg { width: 10px; height: 10px; }
.ctl:hover { background: rgba(0,0,0,.14); }
.ctl.close:hover { background: #c0392b; color: #fff; }
.win:not(.active) .ctl { color: var(--tab-in-fg); opacity: .8; }
.frame { position: relative; height: 100%; display: flex; flex-direction: column; padding: 4px; background: var(--frame); border: 1px solid var(--frame-dk); box-shadow: inset 1px 1px 0 var(--frame-hi), 0 4px 14px rgba(0,0,0,.18); cursor: move; touch-action: none; transition: box-shadow .15s, border-color .15s; }
.win.active .frame { box-shadow: inset 1px 1px 0 var(--frame-hi), inset -1px -1px 0 var(--frame-lo), 0 12px 34px rgba(0,0,0,.42); }
.win:not(.active) .frame { border-color: var(--frame-lo); }
.views { position: relative; flex: 1; min-height: 0; border: 1px solid; border-color: var(--frame-lo) var(--frame-hi) var(--frame-hi) var(--frame-lo); background: var(--content); cursor: auto; touch-action: auto; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
.grip { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; touch-action: none; background: linear-gradient(135deg, transparent 48%, var(--frame-lo) 48% 54%, transparent 54% 64%, var(--frame-lo) 64% 70%, transparent 70% 80%, var(--frame-lo) 80% 86%, transparent 86%); }
.toolbar { display: flex; align-items: center; gap: 6px; padding: 5px 8px; background: var(--frame); border-bottom: 1px solid var(--frame-lo); flex: none; }
.tb { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border: 1px solid var(--frame-lo); border-radius: 3px; background: linear-gradient(var(--frame-hi), var(--frame)); color: var(--fg); text-decoration: none; font-size: 12px; white-space: nowrap; }
.tb:active, .seg.on { background: var(--accent); color: #fff; box-shadow: inset 0 1px 2px rgba(0,0,0,.3); }
.segs { display: flex; }
.seg { width: 32px; height: 26px; display: grid; place-items: center; color: var(--fg); border: 1px solid var(--frame-lo); background: linear-gradient(var(--frame-hi), var(--frame)); }
.seg svg, .tb.nav svg { width: 15px; height: 15px; display: block; }
.tb.nav { padding: 0 6px; }
.tb:disabled { opacity: .4; }
.toc:empty { display: none; }
.seg + .seg { border-left: 0; }
.seg:first-child { border-radius: 3px 0 0 3px; }
.seg:last-child { border-radius: 0 3px 3px 0; }

/* Tracker */
.tracker { container-type: inline-size; }
.tracker .toolbar input { flex: 1; max-width: 320px; margin-left: auto; }
.tk-body { flex: 1; display: flex; min-height: 0; }
.places { width: 190px; flex: none; overflow: auto; background: var(--side); border-right: 1px solid var(--line); padding: 6px 0 16px; }
.places h4 { margin: 10px 12px 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.places button { display: flex; width: 100%; padding: 3px 12px 3px 18px; text-align: left; }
.places button span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.places button small { color: var(--muted); margin-left: 6px; }
.places button:hover { background: var(--zebra); }
.places button.on { background: var(--accent); color: var(--accent-fg); }
.places button.on small { color: inherit; }
.tk-right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.place-sel { display: none; margin: 6px 8px; }
.tk-main { flex: 1; overflow: auto; }
table.list { width: 100%; border-collapse: collapse; table-layout: fixed; }
.list th { position: sticky; top: 0; z-index: 1; text-align: left; font-weight: 600; font-size: 12px; padding: 4px 8px; background: var(--frame); border-bottom: 1px solid var(--frame-lo); border-right: 1px solid var(--line); cursor: pointer; }
.list th.sorted { color: var(--accent); }
.list td { padding: 4px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list td.c-name .ico { width: 16px; height: 16px; vertical-align: -3px; margin-right: 7px; }
.list tr:nth-child(even) td { background: var(--zebra); }
.list tr.sel td { background: var(--accent); color: var(--accent-fg); }
.c-date { width: 118px; } .c-tags { width: 30%; color: var(--muted); } .c-words { width: 76px; text-align: right !important; }
.list tr.sel .c-tags { color: inherit; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; padding: 12px; }
.gi { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 4px; border-radius: 4px; }
.gi img, .gi .ico { width: 88px; height: 64px; object-fit: cover; border: 1px solid var(--line); background: var(--content); }
.gi .ico { border: 0; }
.gi span { font-size: 12px; text-align: center; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; padding: 1px 4px; border-radius: 2px; }
.gi.sel span { background: var(--accent); color: var(--accent-fg); }
.list tr.open td { background: color-mix(in srgb, var(--tab) 26%, var(--content)); font-weight: 600; }
.gi.open span { background: var(--tab); color: #1f1f1f; }
/* Preview view: cards grouped under sticky year headers */
.pv-year { position: sticky; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: baseline; margin: 0; padding: 5px 12px; font: 700 12px var(--ui); background: var(--frame); border-bottom: 1px solid var(--frame-lo); border-top: 1px solid var(--frame-hi); }
.pv-year small { font-weight: 400; color: var(--muted); }
.pv-grid { display: grid; grid-template-columns: 1fr; gap: 8px; padding: 8px; }
.pc { display: grid; grid-template-columns: 72px minmax(0, 1fr); grid-template-areas: 't t' 'img meta'; gap: 6px 10px; padding: 9px 10px; text-align: left; background: var(--content); border: 1px solid var(--line); border-radius: 3px; }
.pc:hover { border-color: var(--accent); }
.pc-t { grid-area: t; font: 600 13.5px/1.3 var(--ui); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pc-img, .pc-tile { grid-area: img; width: 72px; height: 54px; border-radius: 2px; }
.pc-img { object-fit: cover; border: 1px solid var(--line); background: var(--side); }
.pc-tile { display: grid; place-items: center; padding: 4px; overflow: hidden; text-align: center; font: 700 9.5px/1.2 var(--ui); letter-spacing: .05em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, hsl(var(--h) 50% 50%), hsl(var(--h) 45% 34%)); }
.pc-tile .ico { width: 26px; height: 26px; }
.pc-m { grid-area: meta; min-width: 0; display: flex; flex-direction: column; gap: 5px; justify-content: center; }
.pc-row { display: flex; gap: 5px; align-items: center; overflow: hidden; }
.pc-row small { color: var(--muted); font-size: 11px; white-space: nowrap; margin-right: 2px; }
.tg { font-size: 10.5px; line-height: 16px; padding: 0 6px; border-radius: 8px; background: var(--side); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pc-d { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: color-mix(in srgb, var(--accent) 9%, var(--content)); }
.pc.open { border-color: var(--tab-lo); box-shadow: inset 4px 0 0 var(--tab); background: color-mix(in srgb, var(--tab) 16%, var(--content)); }
.pc.open .pc-t::before { content: 'Reading: '; color: var(--tab-lo); }
@container (min-width: 820px) { .pv-grid { grid-template-columns: 1fr 1fr; } }
/* compact rows for everything past the latest five */
.rows { display: flex; flex-direction: column; padding: 2px 0 6px; }
.row { display: flex; align-items: center; gap: 9px; min-height: 30px; padding: 4px 12px; text-align: left; }
.rows .row:nth-child(even) { background: var(--zebra); }
.row:hover { background: color-mix(in srgb, var(--accent) 9%, var(--content)) !important; }
.tico { width: 18px; height: 18px; flex: none; display: grid; place-items: center; border-radius: 4px; font: 700 10px/1 var(--ui); text-transform: uppercase; color: #fff; background: hsl(var(--h) 50% 44%); }
.row .ico { width: 18px; height: 18px; }
.row-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-d { flex: none; margin-left: 8px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.row.sel { background: var(--accent) !important; color: var(--accent-fg); }
.row.sel .row-d { color: inherit; }
.row.open { background: color-mix(in srgb, var(--tab) 24%, var(--content)) !important; box-shadow: inset 3px 0 0 var(--tab); font-weight: 600; }
@container (max-width: 480px) { .row-t { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; } }

/* heading links */
.hlink { margin-left: .4em; font-weight: 400; color: var(--muted) !important; text-decoration: none; opacity: 0; transition: opacity .15s; }
.rd-body h2:hover .hlink, .rd-body h3:hover .hlink, .hlink:focus { opacity: 1; }
.hlink.copied::after { content: ' link copied'; font: 12px var(--ui); color: var(--accent); }
@media (hover: none) { .hlink { opacity: .55; } }
.photos-chip { background: var(--tab) !important; color: #1f1f1f !important; border-color: var(--tab-lo) !important; }

/* related posts: an XFCE-style notification card with a Haiku tab */
.notify { position: fixed; z-index: 99995; padding: 0 8px 8px; background: var(--frame); color: var(--fg); border: 1px solid var(--frame-dk); border-radius: 0 4px 4px 4px; box-shadow: 0 12px 30px rgba(0,0,0,.4); transform: translateY(-16px); opacity: 0; transition: transform .25s ease-out, opacity .25s; }
.notify.in { transform: none; opacity: 1; }
.nt-head { display: flex; align-items: center; gap: 6px; margin: 0 -8px 6px; padding: 4px 6px 4px 10px; background: var(--tab); color: #1f1f1f; font-size: 12px; }
.nt-head .ico { width: 14px; height: 14px; }
.nt-x { width: 26px; height: 22px; font-size: 16px; border-radius: 3px; }
.nt-x:hover { background: rgba(0,0,0,.14); }
.nt-item { display: flex; align-items: center; gap: 10px; width: 100%; padding: 6px; margin-top: 4px; text-align: left; background: var(--content); border: 1px solid var(--line); border-radius: 3px; font-size: 12.5px; line-height: 1.3; }
.nt-item:hover { border-color: var(--accent); }
.nt-img, .nt-item .pc-tile { width: 56px; height: 40px; flex: none; }
.nt-img { object-fit: cover; border: 1px solid var(--line); border-radius: 2px; }
.nt-item span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rel-inline { display: none; margin-top: 2.5em; padding-top: 1em; border-top: 2px solid var(--tab); font-family: var(--ui); }
.rel-inline.force { display: block; }
.rel-inline h3 { margin: 0 0 .4em; }

/* Photos */
.photos { container-type: inline-size; }
.ph-body { flex: 1; display: flex; min-height: 0; }
.albums { width: 220px; flex: none; overflow: auto; background: var(--side); border-right: 1px solid var(--line); padding: 6px 0; }
.albums h4 { margin: 8px 12px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.al { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 10px; text-align: left; font-size: 12.5px; }

<h2 id="configuration">Configuration</h2>
<h3 id="agent-rules">Agent Rules</h3>
<p>Add tight, layered rules - Claude Code loads <code>CLAUDE.md</code> files into context on every single message. Every line you add is tokens the model has to process and remember. Treat it like a config file, not a wiki.</p>
<p>Use two layers:</p>
<ul><li><strong>Global</strong> (<code>~/.claude/CLAUDE.md</code>) - things that apply to every project: language preferences, security rules, things to never do</li><li><strong>Project</strong> (<code>&lt;repo&gt;/CLAUDE.md</code> or <code>&lt;repo&gt;/.claude/CLAUDE.md</code>) - repo-specific context: build commands, architecture decisions, testing patterns</li></ul>
<pre data-lang="text"><code>~/.claude/CLAUDE.md           # always loaded, every project
&lt;project&gt;/CLAUDE.md           # loaded for that project only
&lt;project&gt;/.claude/CLAUDE.md   # alternative location (same effect)</code></pre>
<p>Think about the signal-to-noise ratio. If a rule isn't relevant to the current task, it's just noise misleading the prediction engine. Be clear, concise and specific. Don't blindly import someone else's entire rule set (including mine).</p>
<p>Project-level CLAUDE.md files should be checked into the repo so your whole team benefits.</p>
<p>Remember: Rules are suggestions, not hard controls.</p>
<ul><li><a href="https://code.claude.com/docs/en/memory" target="_blank" rel="noopener">Claude Memory / Rules</a></li><li><a href="https://code.claude.com/docs/en/features-overview#claude-md-vs-rules-vs-skills" target="_blank" rel="noopener">Claude.md vs Rules vs Skills</a></li></ul>
<hr>
<h3 id="enable-sandboxing">Enable sandboxing</h3>
<p><a href="https://code.claude.com/docs/en/sandboxing" target="_blank" rel="noopener">Sandboxing</a> constrains what Claude Code can read, write and connect to. It's the single fastest way to limit the blast radius of a runaway agent.</p>
<p>In <code>~/.claude/settings.json</code>:</p>
<pre data-lang="json"><code>{
  "sandbox": {
    "enabled": true,
    "autoAllowBashIfSandboxed": true,
    "network": {
      "allowedDomains": [
        "*.github.com",
        "*.githubusercontent.com",
        "*.npmjs.com",
        "*.pypi.org",
        "*.crates.io",
        "*.golang.org",
        "*.docker.io",
        "*.smcleod.net"
      ]
    },
    "excludedCommands": ["docker", "ssh", "uv run"]
  }
}</code></pre>
<p>The network allowlist stops the agent from making unexpected outbound connections. <code>autoAllowBashIfSandboxed</code> means you don't get prompted for every shell command when the sandbox is already constraining what it can do. <code>excludedCommands</code> lets you exempt specific commands that need network access the sandbox would otherwise block.</p>
<p>Note: The sandbox is not a silver bullet. Claude can actually choose not to use the Sandbox if it encounters problems with it - and somewhat <a href="https://github.com/anthropics/claude-code/issues/10089" target="_blank" rel="noopener">idiotically there's no way to disable this - _yet_</a>.</p>
<h3 id="configure-agent-permissions-allow-ask-deny">Configure agent permissions (allow, ask, deny)</h3>
<p><a href="https://code.claude.com/docs/en/permissions" target="_blank" rel="noopener">Permissions</a> let you pre-approve safe operations (so you're not interrupted constantly) and hard-block dangerous ones (so a confused agent can't do real damage). The syntax is <code>Tool(pattern *)</code>.</p>
<pre data-lang="json"><code>{
  "permissions": {
    "allow": [
      "Bash(git diff *)",
      "Bash(git status *)",
      "Bash(go *)",
      "Bash(cargo *)",
      "Edit(./**/*.go)",
      "Edit(./**/*.ts*)",
      "Edit(./**/*.py)",
      "WebFetch",
      "WebSearch"
    ],
    "deny": [
      "Bash(sudo *)",
      "Bash(git push *)",
      "Bash(rm -rf ~*)",
      "Read(~/.ssh/**)",
      "Read(**/secrets/**)"
    ],
    "ask": [
      "Bash(git add *)",
      "Bash(git commit *)",
      "Bash(rm -rf *)",
      "Bash(ssh *)",
      "Read(**/.env)"
    ]
  }
}</code></pre>
<p>The deny list is your hard safety net. <code>git push</code> and <code>sudo</code> are the obvious ones. The ask list catches things that are usually fine but you want to eyeball first, like commits and destructive deletes. Everything in allow runs without prompting.</p>
<hr>
<h2 id="lean-into-skills">Lean into skills</h2>
<p><a href="https://agentskills.io" target="_blank" rel="noopener">Skills</a> are an effective way of extending your agent's knowledge. Think of them like a library where the agent can see all the book spines and pull out the relevant one whenever it encounters a situation where that knowledge would be useful. They're simple markdown files that Claude loads into context on demand, rather than permanently like rules.</p>
<p>Skills live in <code>~/.claude/skills/</code> (global) and <code>.claude/skills/</code> (project-level). Each skill has a <code>SKILL.md</code> with a name and concise description in its front matter. The agent sees all skill names and descriptions automatically and self-selects the relevant ones.</p>
<pre data-lang="text"><code>~/.claude/skills/
├── code-review/
├── go-testing/
├── shell-scripting/
├── systematic-debugging/
├── extract-wisdom/
└── ...</code></pre>
<p>As well as the official skills documentation, you can see my <a href="https://github.com/sammcj/agentic-coding/blob/main/Skills/skill-creator/SKILL.md" target="_blank" rel="noopener">skill creator skill</a> (meta, I know).</p>
<p>Note: Never blindly install skills you find online, always review the content and any attached scripts to make sure they're not malicious and are aligned with your goals.</p>
<ul><li>Anthropic publishes some <a href="https://github.com/anthropics/skills" target="_blank" rel="noopener">official skills</a> for common tasks like creating PPTX and DOCX files.</li><li>I publish most of my skills publicly in my <a href="https://github.com/sammcj/agentic-coding/tree/main/Skills" target="_blank" rel="noopener">agentic-coding</a> repo.</li></ul>
<hr>
<h2 id="agent-tools">Agent Tools</h2>
<h3 id="enable-language-servers-lsp">Enable Language Servers (LSP)</h3>
<p>Claude Code has a built-in LSP tool that gives the agent access to go-to-definition, find-references, hover types, and diagnostics - the same code intelligence IDEs use. With LSP enabled, the agent can navigate code structurally rather than relying on text search - jumping to definitions, finding all call sites before refactoring, and catching type errors as it works.</p>
<p>It's enabled by installing <a href="https://code.claude.com/docs/en/discover-plugins#code-intelligence" target="_blank" rel="noopener">code intelligence plugins</a> from the official marketplace:</p>
<pre data-lang="bash"><code># Browse available code intelligence plugins (try searching for 'lsp')
/plugin

# Or install directly, e.g.
/plugin install typescript-lsp@claude-plugins-official</code></pre>
<p>Some LSPs may also need the language servers installed for the languages you work with:</p>
<pre data-lang="bash"><code># Python
pip install python-lsp-server   # or: uvx install python-lsp-server

# Go (included with the Go toolchain)
go install golang.org/x/tools/gopls@latest

# Rust
rustup component add rust-analyzer

# TypeScript / JavaScript
pnpm install -g typescript typescript-language-server</code></pre>
<h3 id="take-a-minimalist-approach-to-mcp-tools">Take a minimalist approach to MCP tools</h3>
<p>Every MCP server you enable adds tool descriptions to the context. If you have 10 servers each exposing 5-20 tools, that's a lot of tokens spent in every interaction just telling the model what's available.</p>
<ul><li>If you have easy to use CLI tools (e.g. <code>gh</code> for Github) - let the agent use those instead of adding permanent MCP servers for them.</li><li>Don't load every MCP server for every project. Use project-level <code>.claude/settings.json</code> to scope servers to where they're actually needed.</li><li>For 99% of tasks <a href="https://github.com/sammcj/mcp-devtools" target="_blank" rel="noopener">I only have one MCP server enabled</a>.</li></ul>
<h3 id="recommended-plugins-and-tools">Recommended plugins and tools</h3>
<ul><li><a href="https://ccsafetynet.com/" target="_blank" rel="noopener">cc-safety-net</a> (hooks that try to catch some destructive commands).</li><li><a href="https://github.com/mksglu/context-mode" target="_blank" rel="noopener">context-mode</a> which significantly reduces context usage.</li><li><a href="https://github.com/Graphify-Labs/graphify" target="_blank" rel="noopener">Graphify</a> can be useful for creating graphs of code and LLM wikis providing them with semantic search and context.</li></ul>
<hr>
<h2 id="workflow">Workflow</h2>
<h3 id="use-planning-mode">Use planning mode</h3>
<p>Planning mode (<code>shift+tab</code> to toggle) keeps the agent in read-only exploration mode. It can use sub-agents, read files, search code, use tools to research - but it can't make changes until you approve its plan.</p>
<p>This is valuable for anything beyond a simple, targeted fix. The plan itself is an artefact you can inspect and refine with Claude, when you're ready Claude will offer to start a fresh session to act upon the plan.</p>
<p><strong><a href="https://smcleod.net/posts/2025-04-28-agentic-coding-dev-flow/" target="_blank" rel="noopener">TLDR</a>: plan first, act second, iterate.</strong></p>
<h3 id="embrace-starting-fresh-sessions">Embrace starting fresh sessions</h3>
<p>LLMs are stateless. Every message you send includes the full conversation history. As a session gets longer, the model has more to process; it slows down and output quality degrades.</p>
<p>Embrace starting fresh sessions, operating from a plan allows you to do this without losing where you're up to.</p>
<h3 id="create-commands-or-skills-for-frequent-prompts">Create commands (or skills) for frequent prompts</h3>
<p>Create commands or skills for frequently used prompts, providing you quick access via <code>/command-name</code>.</p>
<p>Here's my most-used one, <code>/self-review</code> that I run after Claude completes multiple tasks:</p>
<pre data-lang="markdown"><code>---
description: Conduct a critical self-review of your changes &amp; fix any errors
---

Please conduct a critical self-review of your changes, check for
any errors or changes you missed, correct any errors you may find.</code></pre>
<hr>
<p>Most of the rules, skills, hooks and commands I use are in my <a href="https://github.com/sammcj/agentic-coding" target="_blank" rel="noopener">agentic-coding</a> repo. Take what's useful, ignore the rest.</p>
</template>
<template id="body-2026-07-04-agent-skills-common-pitfalls">
<p>I write and review a <em>lot</em> of <a href="https://code.claude.com/docs/en/skills" target="_blank" rel="noopener">Agent</a> <a href="https://agentskills.io" target="_blank" rel="noopener">Skills</a>, and find myself frequently pushing back in reviews, as many authors assume they're writing "<em>just another markdown prompt</em>" without considering that they're actually working with one component of an agentic system.</p>
<p>The <strong>TLDR</strong> of my feedback is usually along the lines of:</p>
<blockquote><ol><li>The descriptions <em>only</em> job is to tell the agent when the skill should be triggered.</li><li>Keep the description as terse as possible while still triggering.</li><li>The SKILL.md should be lean with detail pushed to reference files.</li><li>Put repeatable work in scripts rather than relying on model inference.</li></ol></blockquote>
<hr>
<h2 id="skill-creator-primer">Skill Creator Primer</h2>
<p>I recommend teams use or create their own version of my <a href="https://github.com/sammcj/agentic-coding/blob/main/Skills/skill-creator-primer/SKILL.md" target="_blank" rel="noopener">skill-creator-primer</a> skill.</p>
<p>The primer works alongside the official Anthropic skill-creator skill and aims to catch common pitfalls and align with best practices.</p>
<aside class="adm adm-tip"><b>Proactively use the primer</b><p>While the primer should activate passively when working with skills, to get the most out of it ask your agent to use it to review your work:</p>
<p><em>"First please activate your skill creator primer skill.</em> <em>Then, I want you to look at my coworkers PR: &lt;URL to PR or branch&gt;</em> <em>and conduct a critical review."</em></p></aside>
<h2 id="the-top-five-pitfalls">The top five pitfalls</h2>
<h3 id="1-descriptions-written-as-summaries">1. Descriptions written as summaries</h3>
<p>The descriptions only job is telling the agent when to load the skill. Summarising the contents invites the agent to act on the summary and skip the skill.</p>
<ul><li>Roughly 30-55 words, imperative, naming the specific triggers.</li><li>The description should only contain information that is specific to knowing when to trigger the skill.</li><li>Some agents under-trigger, so be slightly assertive while keeping it tight.</li><li>Unsure it fires? Write a handful of trigger evals: realistic prompts labelled should/shouldn't trigger.</li></ul>
<aside class="adm adm-example"><b>Example:</b><p>description: 'You MUST use this skill whenever the user mentions dashboards, monitoring or metrics.'</p></aside>
<aside class="adm adm-tip"><b>If your skill doesn't need to be triggered by an agent</b><p>Set <code>disable-model-invocation: true</code> in the frontmatter so its description isn't loaded into every session</p></aside>
<h3 id="2-no-progressive-disclosure">2. No progressive disclosure</h3>
<p>The main <code>SKILL.md</code> should inline only what every use of the skill needs, regardless of the situation. Practising progressive disclosure keeps skills lean, reusable and composable.</p>
<p>Other bundled information such as handling for specific scenarios goes in <code>references/&lt;file&gt;.md</code> behind a pointer that says when to read it, e.g:</p>
<aside class="adm adm-example"><b>Example:</b><p>"Step 3: If working on frontend codebase you must first read 'references/frontend.md'"</p></aside>
<h3 id="3-making-the-model-do-a-scripts-job">3. Making the model do a script's job</h3>
<p>If a step is often repeated, deterministic or requires a high degree of accuracy, bundle a small script.</p>
<ul><li>A script is faster, should provide the same result every run and is testable.</li><li>Favour using Python and its stdlib where possible.</li><li>If you <em>need</em> to add dependencies use <a href="https://peps.python.org/pep-0723/" target="_blank" rel="noopener">PEP-723</a> inline metadata.</li><li>Instruct the agent to run with <code>uv run scripts/my-script.py &lt;args&gt;</code>.</li></ul>
<h3 id="4-too-much-content-too-many-skills">4. Too much content, too many skills</h3>
<p>Skills are for agents, not humans. Terse wins. The deletion test: cut a line and ask whether the agent's behaviour would change. If not, it stays cut.</p>
<p>The same can be true for having too many skills (without good reason to do so) - especially if the descriptions aren't tight, focused or well differentiated. Favour one skill with progressive disclosure (references for each scenario) over lots of smaller but related skills.</p>
<h3 id="5-stepped-workflows-with-no-structure">5. Stepped workflows with no structure</h3>
<p>For workflows that must be followed within a skill:</p>
<ul><li>Instruct the agent to track each step.</li><li>Number the steps.</li><li>Trigger a review after all steps are complete.</li></ul>
<aside class="adm adm-example"><b>Example:</b><p>Create and track a task / TODO for each step:</p>
<ol><li>Do x</li><li>Do y</li><li>Do z</li></ol>
<p>Once all steps are completed conduct a critical review of the work and make any necessary corrections.</p></aside>
<p>Agents drift and finish early on long procedures; a visible checklist stops that. The same is true if your skill instructs the agent to task sub-agents with their own workflows.</p>
<h2 id="general-tips">General tips</h2>
<ul><li>Don't wrap text in markdown - manual line breaks mean more lines for the agent to read in.</li><li>For reference files over ~100 lines, add a simple TOC near the top (but not in the main <code>SKILL.md</code>).</li><li>If your skill is very complex, add an <code>AGENTS.md</code> / <code>CLAUDE.md</code> in its root to help you and others maintain it.</li><li>A single entry point for interacting with your software project (<code>make lint</code>, <code>make test</code>, <code>make build</code>, <code>make run</code>, etc.) makes it easy for agents and skills to do the right thing everywhere.</li></ul>
<h2 id="a-note-on-agent-skills-vs-custom-agents">A note on Agent Skills vs Custom Agents</h2>
<ul><li>Custom Agents:</li><li class="sub">Can be thought of as a "persona", think as if you were asked to put yourself in someone else's shoes.</li><li class="sub">May include workflows / ways of working but keep it light and instead have them use skills.</li><li class="sub">Good for adversarial tasks as they get their own context and world view.</li><li class="sub">Operate within their own context (usually).</li><li>For knowledge, detailed workflows, helper tools etc., favour Skills over Custom Agents.</li><li>Skills are powerful as they're composable and often portable.</li><li>If you need a custom agent and want it to be read-only, set <code>permissionsMode: plan</code> in its frontmatter.</li><li>There's no need to create a custom agent for normal development tasks - that's what the main / general agent is for.</li></ul>
<h2 id="review-signals">Review signals</h2>
<p>Quick tells that a skill wasn't reviewed carefully:</p>
<ul><li>Descriptions that have information not specific to knowing when to trigger the skill.</li><li>Descriptions that are more than 1-3 tight sentences - if it looks like a paragraph, it probably hasn't been thought through.</li><li>Overly verbose, long form prose in the body of the skill or resources.</li><li>Getting agents to do the work of scripts, have them write and drive the scripts instead.</li><li><em>"When to use"</em> in the body - if the agent is reading that, it's too late. It's also a sign the author may not have understood what they were creating.</li></ul>
<h2 id="security-tips">Security tips</h2>
<p>Treat third party skills as you would any other software or library obtained from the internet - don't blindly install them without first reviewing their content.</p>
<ul><li>Skills can include both prompts (<code>SKILL.md</code>, references) and scripts, review the markdown for malicious or risky instructions that could mislead the agent.</li><li>If the skill contains scripts, consider running dependency and SAST scanning tools (e.g. SonarQube) across the content.</li><li>When writing scripts within skills, aim to use the standard library where possible.</li><li>Apply the principle of least privilege in the frontmatter configuration - does the skill really need web search or write tools?</li><li>Where possible, run your agentic coding tool in a sandbox.</li></ul>

/* ---------- window manager ---------- */
const G = 6; // gap around snapped windows
function deskRect() { return { w: desk.clientWidth, h: desk.clientHeight - $('#dock').offsetHeight - 16 }; }

function createWindow(view, geo = {}) {
  const d = deskRect(), th = tabH();

    x: Math.round(geo.x ?? Math.max(10, (d.w - w) / 2 - 40 + off)), y: Math.round(geo.y ?? th + 16 + off),
  };
  win.tabsEl = h('div', { class: 'tabs' });
  win.viewsEl = h('div', { class: 'views' });

function ctl(cls, icon, label) {

  win.tabsEl.replaceChildren(...win.views.map((v, i) => {
    const on = i === win.active;
    const t = h('div', { class: 'tab' + (on ? ' on' : ''), title: v.title },
      h('span', { class: 'tt' }, v.title),
      on ? ctl('min', 'min', 'Minimise') : null,
      on ? ctl('max', win.snap ? 'restore' : 'max', win.snap ? 'Restore' : 'Maximise') : null,
      ctl('close', 'x', 'Close ' + v.title));

    help: () => print('ls [year|tag]   list posts (tap a name to open it)\ncat <post>      print a post\nopen <post>     open a post in a window\ngrep <text>     search titles, tags and descriptions\ntags            list the most used tags\nwhoami  neofetch  date  uname  pwd  echo  theme [light|dark]  clear'),
    ls: a => {
      const list = a ? POSTS.filter(p => p.d.startsWith(a) || p.tags.includes(a.toLowerCase())) : POSTS.slice(0, 15);
      if (!list.length) return print(`ls: cannot access '${a}': no such year or tag`);
      list.forEach(postLine);
      if (!a) print(dim(`${POSTS.length - 15} older posts not shown. Try ls 2015 or ls mcp.`));
    },
    cat: a => {
      const p = a && find(a);
      if (!p) return print(`cat: ${a || 'missing operand'}: no such post`);
      const tpl = document.getElementById('body-' + p.b);
      print(h('b', {}, p.t));
      print(tpl ? tpl.content.textContent.replace(/\n{3,}/g, '\n\n').trim() : p.desc);
      if (!tpl) print(dim('Full text: ' + SITE + p.u));
    },
    open: a => { const p = a && find(a); p ? openPost(p) : print(`open: ${a || 'missing operand'}: no such post`); },
    grep: a => {
      if (!a) return print('usage: grep <text>');
      const s = a.toLowerCase(), m = POSTS.filter(p => (p.t + ' ' + p.desc + ' ' + p.tags.join(' ')).toLowerCase().includes(s));
      m.forEach(postLine);
      print(dim(`${m.length} match${m.length === 1 ? '' : 'es'}`));
    },
    tags: () => { const m = new Map(); POSTS.forEach(p => p.tags.forEach(t => m.set(t, (m.get(t) || 0) + 1))); print([...m].sort((a, b) => b[1] - a[1]).slice(0, 30).map(([t, n]) => `${t} (${n})`).join('   ')); },
    whoami: () => print('sam\nAI engineer, open source contributor and music geek based in Melbourne, Australia.'),
    date: () => print(new Date().toLocaleString('en-AU', { timeZone: 'Australia/Melbourne', dateStyle: 'full', timeStyle: 'long' })),
    uname: () => print(`deskbar-sh ${navigator.userAgentData?.platform || navigator.platform || 'unknown'} smcleod.net`),
    pwd: () => print('/home/sam'),
    echo: a => print(a),
    sudo: () => print('sam is not in the sudoers file. This incident will be reported.'),
    theme: a => { setTheme(a === 'light' || a === 'dark' ? a : null); print('theme: ' + document.documentElement.dataset.theme); },
    clear: () => out.replaceChildren(),
    neofetch: () => {
      const words = POSTS.reduce((s, p) => s + p.w, 0);
      const info = [['OS', 'smcleod.net Deskbar Classic'], ['Host', navigator.userAgentData?.platform || navigator.platform || 'unknown'],
        ['Uptime', Math.floor((Date.now() - S.t0) / 60000) + ' min'], ['Posts', `${POSTS.length} (${POSTS.at(-1).d.slice(0, 4)} to ${POSTS[0].d.slice(0, 4)})`],
        ['Words', Math.round(words / 1000) + 'k'], ['Shell', 'deskbar-sh'], ['Resolution', `${innerWidth}x${innerHeight} @${devicePixelRatio}x`],
        ['Theme', document.documentElement.dataset.theme], ['Windows', S.wins.length],
        ['CPU', (navigator.hardwareConcurrency || '?') + ' logical cores'], ['Timezone', 'Australia/Melbourne']];
      print(h('div', { class: 'neo' }, h('pre', { class: 'art' }, " ___ _ __  \n(_-<| '  \\ \n/__/|_|_|_|"),
        h('div', {}, h('b', { class: 'ps1' }, 'sam@smcleod.net'), h('div', { class: 'dim' }, '---------------'),
          info.map(([k, val]) => h('div', {}, h('b', { class: 'k' }, k + ': '), String(val))),
          h('div', { class: 'sw' }, ['#ffcb00', '#3467b8', '#2e9d5b', '#c0392b', '#d8d8d8', '#36393d'].map(c => h('i', { style: 'background:' + c }))))));
    },
  };
  function run(line) {
    print(h('span', { class: 'ps1' }, 'sam@smcleod:~$ '), line);
    const [cmd, ...args] = line.trim().split(/\s+/);
    if (!cmd) return;
    if (!CMDS[cmd]) return print(`${cmd}: command not found. Try help.`);
    CMDS[cmd](args.join(' '));
  }
  const form = h('form', { class: 'prompt', onsubmit: e => { e.preventDefault(); const l = inp.value; inp.value = ''; run(l); } }, h('span', { class: 'ps1' }, 'sam@smcleod:~$'), inp);
  const el = h('div', { class: 'view term' }, out, form, h('div', { class: 'chips' }, ['help', 'ls', 'tags', 'whoami', 'neofetch', 'clear'].map(c => h('button', { type: 'button', onclick: () => run(c) }, c))));
  print(dim('deskbar-sh on smcleod.net. Type help or tap a command below.'));
  createWindow({ key: 'terminal', route: '/terminal', title: 'Terminal', icon: 'term', el }, { w: 720, h: 460 });
}

/* ---------- boot ---------- */
const DESK_ICONS = [['Posts', APPS.tracker], ['Photos', APPS.photos], ['Tools', APPS.tools], ['Terminal', APPS.terminal], ['piper.jpg', APPS.piper], ['smcleod.net', { icon: 'globe', open: () => ext(SITE) }]];
$('#icons').replaceChildren(...DESK_ICONS.map(([l, a]) => { const b = h('button', { class: 'dicon' }, ico(a.icon), h('span', {}, l)); b._open = a.open; return b; }));
bindOpen($('#icons'), '.dicon');
$('#homeBtn').onclick = goHome;
$('#menuBtn').onclick = () => togglePopup('#whisker');
$('#winsBtn').onclick = () => togglePopup('#switcher');
$('#themeBtn').onclick = () => setTheme();
$('#recentMin').onclick = () => { S.widgetMin = true; refresh(); };
setTheme(store.get('theme', matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
applyReadSize(0);
buildWhisker();
tick();
setInterval(tick, 10000);
addEventListener('resize', () => {
  const d = deskRect();
  for (const w of S.wins) if (!w.snap) { w.x = Math.min(w.x, d.w - 60); w.y = Math.min(w.y, d.h - 10); place(w); clampTab(w); }
  S.split = clampSplit(S.split);
  relayout();
  refresh();
});
mq.addEventListener('change', () => { relayout(); S.wins.forEach(w => place(w)); focus(S.focused || topWin()); S.wins.forEach(clampTab); });

$('#recentList').replaceChildren(...POSTS.slice(0, 5).map(p => h('button', { class: 'rp', onclick: () => openPost(p) },
  thumbOf(p, 'rp-img'), h('span', { class: 'rp-t' }, h('b', {}, p.t), h('small', {}, fmtDate(p.d)), h('span', { class: 'rp-d' }, excerpt(p.desc))))),
  h('button', { class: 'tb rp-all', onclick: () => go('/posts') }, 'All ' + POSTS.length + ' posts'));
// first load shows the desktop and widget only, unless the URL names somewhere to go
R.stack = [curPath()];
route(curPath());
</script>
