<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Applications folder icon concepts</title>
<style>
  body { margin: 0; font: 13px/1.4 'Noto Sans', system-ui, sans-serif; background: #d8d8d8; color: #1f1f1f; }
  h1 { font-size: 15px; margin: 0; padding: 12px 16px; background: linear-gradient(#484b50, #36393d); color: #ececec; }
  section { display: flex; gap: 10px; padding: 16px; align-items: flex-end; }
  section h2 { writing-mode: vertical-rl; transform: rotate(180deg); margin: 0; font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; opacity: .7; }
  .desk { background: radial-gradient(circle at 30% 20%, #45709e, #2b4b72 60%, #1b304c); color: #fff; }
  .dock { background: rgba(42,44,48,.97); color: #ececec; }
  .menu { background: #f4f4f4; color: #1f1f1f; }
  figure { margin: 0; width: 150px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  figure .sizes { display: flex; align-items: flex-end; gap: 6px; height: 64px; }
  figcaption { font-size: 12px; text-align: center; }
  figcaption b { display: block; font-size: 13px; }
  .desk svg { filter: drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
  .ref figcaption { font-style: italic; }
  hr { border: 0; border-left: 1px solid currentColor; opacity: .25; align-self: stretch; margin: 0 6px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffdc6e"/><stop offset="1" stop-color="#eea01c"/></linearGradient>
    <linearGradient id="gB" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ccaff"/><stop offset="1" stop-color="#2f66b5"/></linearGradient>
    <linearGradient id="gS" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f4f4"/><stop offset="1" stop-color="#a9adb3"/></linearGradient>
  </defs>
  <symbol id="base" viewBox="0 0 32 32"><path d="M3 7h9l3 3h14v16H3z" fill="#c67d10" stroke="#7a4a00"/><path d="M5 13h26l-3 13H3z" fill="url(#gF)" stroke="#7a4a00"/></symbol>

  <!-- A: pencil and ruler crossed, the drawing-office tools behind the macOS folder, without its A shape -->
  <symbol id="c-a" viewBox="0 0 32 32"><use href="#base"/>
    <g transform="translate(23 21) rotate(-42)" stroke-linejoin="round"><rect x="-2.3" y="-8.5" width="4.6" height="17" rx=".6" fill="url(#gB)" stroke="#1f4a86"/><path d="M-2.3-5.5h2M-2.3-2.5h1.2M-2.3.5h2M-2.3 3.5h1.2M-2.3 6.5h2" stroke="#fff" stroke-width=".9"/></g>
    <g transform="translate(23 21) rotate(42)" stroke-linejoin="round"><path d="M-2-6h4v10h-4z" fill="#e8483f" stroke="#7a1712"/><path d="M-2-8.8h4v2.8h-4z" fill="#f2a7b8" stroke="#7a1712"/><path d="M-2 4l2 4.8 2-4.8z" fill="#f1d3a0" stroke="#7a1712"/><path d="M-.75 5.8.75 5.8 0 8.6z" fill="#333"/></g>
  </symbol>

  <!-- B: a rocket lifting off the folder (new) -->
  <symbol id="c-b" viewBox="0 0 32 32"><use href="#base"/>
    <g transform="translate(23.5 20.5) rotate(40)" stroke-linejoin="round"><path d="M-2.3 5h4.6L0 10.5z" fill="#ffcb00" stroke="#c0600c"/><path d="M-3.4 1.5-6.8 5.5v2.2l3.4-1.4zM3.4 1.5l3.4 4v2.2L3.4 6.3z" fill="#e8483f" stroke="#7a1712"/><path d="M0-10.5c2.9 2.4 3.9 6 3.9 9.5V5.5h-7.8V-1c0-3.5 1-7.1 3.9-9.5z" fill="url(#gS)" stroke="#4d4d4d"/><path d="M0-10.5c1.6 1.3 2.6 2.9 3.1 4.6h-6.2c.5-1.7 1.5-3.3 3.1-4.6z" fill="#e8483f" stroke="#7a1712"/><circle cx="0" cy="-1" r="1.9" fill="url(#gB)" stroke="#1f4a86"/></g>
  </symbol>

  <!-- C: two floppy disks, software as it used to arrive (BeOS-era) -->
  <symbol id="c-c" viewBox="0 0 32 32"><use href="#base"/>
    <path d="M19.5 12.5h8.5l2 2v9.5h-10.5z" fill="#e8483f" stroke="#7a1712" stroke-linejoin="round"/><path d="M22 12.5h5v3.4h-5z" fill="#d8d8d8" stroke="#7a1712" stroke-width=".8"/>
    <path d="M14.5 16.5h9.5l2.5 2.5v10h-12z" fill="url(#gB)" stroke="#1f4a86" stroke-linejoin="round"/><path d="M17.5 16.5h5.5v4h-5.5z" fill="#d8d8d8" stroke="#4d4d4d" stroke-width=".8"/><path d="M21.3 17.3v2.4" stroke="#4d4d4d" stroke-width="1.1"/><path d="M16.5 23h8v6h-8z" fill="#fff"/><path d="M17.8 25h5.4M17.8 27h3.8" stroke="#4d86d6" stroke-width=".9"/>
  </symbol>

  <!-- D: toy building blocks, apps as things you put together (new) -->
  <symbol id="c-d" viewBox="0 0 32 32"><use href="#base"/>
    <g stroke-linejoin="round"><rect x="15.5" y="21.5" width="7" height="7" rx=".8" fill="#e8483f" stroke="#7a1712"/><rect x="22.5" y="21.5" width="7" height="7" rx=".8" fill="url(#gB)" stroke="#1f4a86"/><rect x="19" y="14.5" width="7" height="7" rx=".8" fill="#2e9d5b" stroke="#1b5e36"/>
    <path d="M17 26.5v-3.5h3.5M24 26.5v-3.5h3.5M20.5 19.5V16H24" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width=".9"/></g>
  </symbol>

  <!-- E: a drafting compass drawing an arc (new) -->
  <symbol id="c-e" viewBox="0 0 32 32"><use href="#base"/>
    <path d="M16.2 26.5a7.6 7.6 0 0 0 13.6 0" fill="none" stroke="#e8483f" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M23 15.5 17.3 29M23 15.5 28.7 29" stroke="#26282c" stroke-width="3.2" stroke-linecap="round"/><path d="M23 15.5 17.3 29M23 15.5 28.7 29" stroke="#b8bcc2" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M22 10.5h2v3h-2z" fill="#4d4d4d"/><circle cx="23" cy="15.3" r="2.6" fill="url(#gB)" stroke="#1f4a86"/>
  </symbol>

  <!-- F: a red toolbox with a spanner (new) -->
  <symbol id="c-f" viewBox="0 0 32 32"><use href="#base"/>
    <path d="M25.3 20.2l2.6-6.5" stroke="#4d4d4d" stroke-width="2.2" stroke-linecap="round"/><path d="M28.9 11.3a2.4 2.4 0 1 1-2.2 3.2l1.6-.6.7-1.7z" fill="url(#gS)" stroke="#4d4d4d" stroke-linejoin="round"/>
    <path d="M19.2 19.5v-2.8h6.6v2.8" fill="none" stroke="#4d4d4d" stroke-width="1.6"/>
    <rect x="14.5" y="19.5" width="16" height="9" rx="1" fill="#e8483f" stroke="#7a1712"/><path d="M15 23h15" stroke="#7a1712"/><path d="M15.5 20.6h14" stroke="#fff" stroke-opacity=".45"/><rect x="21" y="22" width="3" height="2.4" rx=".3" fill="#ffcb00" stroke="#7d6300" stroke-width=".7"/>
  </symbol>

  <!-- references, as in icons.html -->
  <symbol id="i-favourites" viewBox="0 0 32 32"><use href="#base"/><path d="M22.5 13.2l2.3 4.8 5.2.7-3.8 3.7.9 5.2-4.6-2.5-4.6 2.5.9-5.2-3.8-3.7 5.2-.7z" fill="#e8483f" stroke="#7a1712" stroke-linejoin="round"/></symbol>
  <symbol id="i-projects" viewBox="0 0 32 32"><use href="#base"/><path d="M20 16v9.5M27.5 17c0 4.5-7.5 2.5-7.5 6" stroke="#4d4d4d" stroke-width="2" fill="none"/><circle cx="20" cy="15.5" r="2.6" fill="#2e9d5b" stroke="#1b5e36"/><circle cx="20" cy="26" r="2.6" fill="#2e9d5b" stroke="#1b5e36"/><circle cx="27.5" cy="16.5" r="2.6" fill="url(#gB)" stroke="#1f4a86"/></symbol>
</svg>

<h1>Applications folder: six concepts, with Favourites and Projects for comparison</h1>
<div id="rows"></div>

<script>
  const concepts = [
    ['c-a', 'A', 'Pencil and ruler'], ['c-b', 'B', 'Rocket'], ['c-c', 'C', 'Floppy disks'],
    ['c-d', 'D', 'Building blocks'], ['c-e', 'E', 'Drafting compass'], ['c-f', 'F', 'Toolbox'],
  ];
  const refs = [['i-favourites', 'Favourites'], ['i-projects', 'Projects']];
  const icon = (id, s) => `<svg width="${s}" height="${s}" aria-hidden="true"><use href="#${id}"/></svg>`;
  const fig = (id, cap, cls = '') => `<figure class="${cls}"><div class="sizes">${[24, 32, 64].map(s => icon(id, s)).join('')}</div><figcaption>${cap}</figcaption></figure>`;
  document.getElementById('rows').innerHTML = [['desk', 'Desktop'], ['dock', 'Dock'], ['menu', 'Menu']].map(([cls, label]) =>
    `<section class="${cls}"><h2>${label}</h2>${concepts.map(([id, l, n]) => fig(id, `<b>${l}</b>${n}`)).join('')}<hr>${refs.map(([id, n]) => fig(id, n, 'ref')).join('')}</section>`).join('');
</script>
</body>
</html>
