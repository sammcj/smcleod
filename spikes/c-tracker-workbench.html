<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>smcleod.net - Tracker Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Noto+Sans:wght@400;600;700&display=swap">
<style>
:root{
  --ink:#2a2118; --ink2:#5d5346; --line:#2a2118;
  --chrome:#e2ddd1; --chrome-hi:#f7f4ed; --chrome-lo:#b3aa98; --chrome-dk:#8c8373;
  --tab:#ffd04a; --tab2:#efa817; --tab-in:#e3dfd3; --tab-in2:#cbc4b3;
  --paper:#fbf8f1; --teal:#1f7d86; --teal-d:#155a61; --rust:#c2582a;
  --tabH:28px; --btn:17px; --bar:172px; --fs:1;
  --ui:"Noto Sans",system-ui,sans-serif; --read:"Literata",Georgia,serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (pointer:coarse){:root{--tabH:38px;--btn:24px}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{font:13px/1.4 var(--ui);color:var(--ink);background:#1b3a40;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
use{fill:none}
a{color:var(--teal-d)}

/* Desktop: a teal cutting mat under a dusk glow */
#desk{position:fixed;inset:0;overflow:hidden;background:
  radial-gradient(110% 55% at 25% 110%,rgba(238,150,72,.45),transparent 62%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 1px,transparent 1px 160px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 160px),
  repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 32px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.028) 0 1px,transparent 1px 32px),
  linear-gradient(168deg,#215459 0%,#1c3d48 48%,#2c2742 100%)}
.icons{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:4px;z-index:1}
.dicon{width:92px;padding:6px 4px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:5px;border-radius:6px}
.dicon svg,.dicon img{width:48px;height:48px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
.dicon img{object-fit:cover;border:2px solid var(--line);border-radius:3px;background:#fff;width:44px;height:40px;margin:4px 0}
.dicon span{color:#fff;font-weight:600;font-size:12px;line-height:1.25;text-shadow:0 1px 2px #000,0 0 6px rgba(0,0,0,.6);padding:1px 6px;border-radius:3px}
.dicon:hover span{background:rgba(0,0,0,.3)}
.dicon:active span{background:var(--teal);text-shadow:none}

/* Replicants (desktop widgets) */
.rep{position:absolute;width:300px;z-index:2;background:linear-gradient(var(--chrome-hi),var(--chrome));border:1px solid var(--line);border-radius:4px;box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 var(--chrome-lo),0 10px 24px rgba(0,0,0,.35)}
.rep h3{margin:0;padding:6px 10px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);border-bottom:1px solid var(--chrome-lo);display:flex;justify-content:space-between;gap:8px}
.rep h3 span{font-weight:400;letter-spacing:0;text-transform:none}
.grab{position:absolute;right:2px;bottom:2px;width:16px;height:16px;cursor:move;touch-action:none;opacity:.7}
.grab:hover{opacity:1}
.grab svg{width:16px;height:16px;display:block}
.lp-card{display:block;width:100%;padding:0;border:0;background:none;text-align:left}
.lp-cover{display:grid;place-items:center;height:92px;background:#2b2622 center/cover no-repeat;border-bottom:1px solid var(--chrome-lo)}
.lp-cover.none{background:linear-gradient(135deg,#2d5f66,#2c2742)}
.lp-cover svg{width:56px;height:56px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.5))}
.lp-body{display:block;padding:9px 12px 4px}
.lp-body small{color:var(--ink2);font-size:11.5px}
.lp-body strong{display:block;font:600 16px/1.3 var(--read);margin:2px 0 5px}
.lp-body span{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink2);font-size:12.5px}
.lp-card:hover strong{color:var(--teal-d);text-decoration:underline}
.lp-nav{display:flex;gap:6px;padding:6px 26px 8px 12px}
.xb{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 11px;border:1px solid var(--chrome-dk);border-radius:3px;background:linear-gradient(#fdfcf9,#e0d9cb);box-shadow:inset 0 1px 0 #fff;font-size:12px;text-decoration:none;color:var(--ink)}
.xb:hover{background:linear-gradient(#fffdf6,#ece5d4);border-color:#6f6656}
.xb:active{background:linear-gradient(#d8d1c2,#ece6d9);box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.xb svg{width:16px;height:16px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 10px 6px}
.kpis div{background:#171b1a;border:1px solid #000;border-radius:3px;padding:4px 7px;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.kpis b{display:block;font:700 17px var(--mono);color:#9ff0b0}
.kpis span{font-size:10.5px;color:#a9b6ae}
.spark{display:block;width:calc(100% - 20px);height:72px;margin:0 10px;background:#141816;border:1px solid #000;border-radius:3px}
.spark line{stroke:#2a3431;stroke-width:1}
.spark .bar{fill:url(#gBar)}
.spark .bar.cur{fill:var(--tab)}
.spark g{cursor:pointer}
.spark g:hover .bar{fill:#ffe07a}
.axis{display:flex;justify-content:space-between;margin:2px 12px 0;font:10.5px var(--mono);color:var(--ink2)}
.ro{margin:4px 10px 6px;font-size:12px;min-height:17px}
.tops{padding:0 10px 22px;display:grid;gap:2px}
.tops button{display:grid;grid-template-columns:78px 1fr 28px;align-items:center;gap:8px;border:0;background:none;padding:3px 2px;border-radius:3px;text-align:left;font-size:12px;min-height:24px}
.tops button:hover{background:rgba(31,125,134,.12)}
.tops i{height:7px;border-radius:4px;background:linear-gradient(90deg,var(--teal),#5cc3bb);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.tops b{text-align:right;font:12px var(--mono)}
.note{background:linear-gradient(#fff6b8,#f7e27e);border-color:#6b5a1c;transform:rotate(-1.2deg)}
.note h3{border-color:#d4bd5a;color:#6b5a1c}
.note button{display:block;width:100%;border:0;background:none;text-align:left;padding:10px 14px 22px}
.note q{display:block;font:italic 400 15px/1.5 var(--read);quotes:none}
.note cite{display:block;margin-top:6px;font:600 12px var(--ui);font-style:normal;color:#6b5a1c}

/* Deskbar */
#deskbar{position:fixed;top:0;right:0;width:var(--bar);z-index:9000;background:var(--chrome);border:1px solid var(--line);border-top:0;border-right:0;border-bottom-left-radius:4px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.leaf{display:flex;align-items:center;gap:8px;width:100%;height:42px;padding:0 10px;border:0;border-bottom:1px solid var(--chrome-lo);background:linear-gradient(#fdfbf6,#dcd5c7);font-weight:700;font-size:14px;box-shadow:inset 0 1px 0 #fff}
.leaf svg{width:28px;height:28px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.leaf[aria-expanded=true]{background:linear-gradient(#3a9aa3,var(--teal));color:#fff}
.tray{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:4px;padding:2px 4px 2px 8px;border:1px solid var(--chrome-lo);border-radius:3px;background:linear-gradient(#d6cfc1,#e7e2d8);box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
.tz{font-size:10.5px;color:var(--ink2);letter-spacing:.05em;text-transform:uppercase}
#clock{border:0;background:none;padding:3px 4px;font:600 12.5px var(--ui);font-variant-numeric:tabular-nums;min-height:24px}
.teams{padding:2px 0 6px}
.team-h{display:flex;align-items:center;gap:6px;padding:6px 8px 2px;font-weight:700;font-size:12px}
.team-h svg{width:18px;height:18px}
.team-w{display:block;width:100%;border:0;background:none;padding:4px 8px 4px 32px;min-height:26px;text-align:left;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team-w:hover{background:rgba(255,255,255,.6)}
.team-w.on{background:linear-gradient(#fff4c8,#ffe08a);box-shadow:inset 0 0 0 1px #d6a526}
.team-w.min{color:var(--ink2);font-style:italic}
.none{margin:6px 10px;color:var(--ink2);font-size:12px}
#menu{position:fixed;top:42px;right:0;width:250px;z-index:9001;background:linear-gradient(90deg,var(--chrome-hi),var(--chrome));border:1px solid var(--line);box-shadow:0 10px 24px rgba(0,0,0,.4);padding:4px 0;max-height:calc(100dvh - 50px);overflow:auto}
.mi{display:flex;align-items:center;gap:10px;width:100%;min-height:34px;padding:5px 12px;border:0;background:none;text-align:left;text-decoration:none;color:inherit}
.mi svg{width:22px;height:22px;flex:none}
.mi:hover{background:linear-gradient(#3a9aa3,var(--teal));color:#fff}
.mh{padding:9px 12px 3px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);border-top:1px solid var(--chrome-lo);margin-top:4px}
.mob{display:none}

/* XFCE-style dock with intelligent hiding */
#dock{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:max-content;z-index:8999;display:flex;align-items:flex-end;gap:4px;padding:6px 10px 9px;background:linear-gradient(rgba(62,54,47,.93),rgba(33,29,26,.96));border:1px solid rgba(0,0,0,.6);border-bottom:0;border-radius:10px 10px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14);transition:transform .25s ease}
#dock.hid{transform:translateY(calc(100% + 2px))}
.dk{position:relative;display:grid;place-items:center;width:54px;height:54px;border:0;border-radius:8px;background:none;transition:transform .16s ease,background .16s}
.dk svg{width:42px;height:42px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.dk:hover{transform:translateY(-5px);background:rgba(255,255,255,.08)}
.dk:active{transform:translateY(-1px) scale(.92)}
.dk .lbl{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);padding:3px 8px;border-radius:4px;background:#1e1a17;color:#f3eee4;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s}
.dk:hover .lbl{opacity:1}
.dk.run::after{content:"";position:absolute;bottom:-5px;left:50%;width:16px;height:3px;margin-left:-8px;border-radius:2px;background:var(--tab);box-shadow:0 0 6px rgba(255,208,74,.7)}
.dsep{width:1px;align-self:stretch;margin:6px 4px;background:rgba(255,255,255,.14)}
@media (hover:none){.dk:hover{transform:none;background:none}.dk:hover .lbl{opacity:0}}
#grip{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:140px;height:16px;z-index:8998;border:0;background:none;padding:0}
#grip::before{content:"";display:block;width:60px;height:5px;margin:6px auto 0;border-radius:3px;background:rgba(255,255,255,.5);box-shadow:0 0 0 1px rgba(0,0,0,.35)}
@media (pointer:coarse){#grip{height:30px}#grip::before{margin-top:18px}}

/* Windows: Haiku yellow tab over a warm Clearlooks frame */
.win{position:absolute;display:flex;flex-direction:column}
.win.new{animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}}
.win.min{display:none}
.tab{align-self:flex-start;max-width:100%;min-width:150px;height:var(--tabH);display:flex;align-items:center;gap:8px;padding:0 6px;margin-bottom:-1px;position:relative;z-index:1;background:linear-gradient(#ffe383,var(--tab) 48%,var(--tab2));border:1px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;box-shadow:inset 1px 1px 0 rgba(255,255,255,.75);touch-action:none;cursor:default}
.win:not(.focus) .tab{background:linear-gradient(#f1eee6,var(--tab-in) 50%,var(--tab-in2));color:var(--ink2)}
.ttl{flex:1 1 auto;min-width:0;padding:0 6px 0 2px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb{position:relative;flex:none;width:var(--btn);height:var(--btn);padding:0;border:1px solid var(--line);border-radius:2px;background:linear-gradient(135deg,#fff,#ece3c8 55%,#c7b78b)}
.win:not(.focus) .wb{background:linear-gradient(135deg,#fff,#e6e1d5 55%,#bdb5a4)}
.wb::before{content:"";position:absolute;inset:-6px}
.wb:active{background:linear-gradient(135deg,#c7b78b,#ece3c8)}
.mini::after{content:"";position:absolute;left:3px;right:3px;bottom:3px;height:2px;background:var(--line)}
.zoom::after{content:"";position:absolute;left:2px;top:2px;width:48%;height:48%;border:1px solid var(--line);background:linear-gradient(135deg,#fff,#d9cfae)}
.frame{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;padding:4px;border:1px solid var(--line);border-radius:0 3px 3px 3px;background:linear-gradient(var(--chrome-hi),var(--chrome));box-shadow:inset 1px 1px 0 #fff,inset -1px -1px 0 var(--chrome-lo),0 14px 32px rgba(0,0,0,.42)}
.body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;background:#fff;border:1px solid var(--chrome-dk);container-type:inline-size}
.knob{position:absolute;right:1px;bottom:1px;width:16px;height:16px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 0 44%,var(--chrome-dk) 44% 52%,transparent 52% 62%,var(--chrome-dk) 62% 70%,transparent 70% 80%,var(--chrome-dk) 80% 88%,transparent 88%)}
.knob::before{content:"";position:absolute;inset:-8px}
.win.shaded{height:auto!important}
.win.shaded .frame{flex:none;height:9px;padding:0}
.win.shaded .body,.win.shaded .knob{display:none}

/* Tracker (post browser) */
.tbar{display:flex;gap:6px;align-items:center;padding:6px;background:linear-gradient(#f6f3ec,#e2dcd0);border-bottom:1px solid var(--chrome-lo)}
.srch{flex:1;min-width:0;height:32px;padding:0 10px;border:1px solid var(--chrome-dk);border-radius:3px;font:inherit;background:#fff;box-shadow:inset 0 1px 2px rgba(0,0,0,.15);user-select:text}
.srch:focus{outline:2px solid var(--teal);outline-offset:-1px}
.cols,.row{display:grid;grid-template-columns:1fr 96px 190px;align-items:center;gap:10px}
.cols{padding:0 10px;background:linear-gradient(#fbfaf6,#e6e1d6);border-bottom:1px solid var(--chrome-lo);font-size:12px}
.cols button{border:0;background:none;padding:5px 0;text-align:left;font-weight:600}
.cols button.on::after{content:" \25BE"}
.cols button.on.up::after{content:" \25B4"}
.rows{flex:1;min-height:0;overflow:auto}
.row{width:100%;min-height:38px;padding:4px 10px;border:0;border-bottom:1px solid #f0ece3;background:none;text-align:left}
.row:nth-child(even){background:#faf8f3}
.row:hover{background:#fff3c4}
.nm{display:flex;align-items:center;gap:8px;min-width:0}
.nm svg{width:22px;height:22px;flex:none}
.nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt{color:var(--ink2);font-variant-numeric:tabular-nums}
.tg{color:var(--ink2);font-size:11.5px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.stat{flex:none;padding:3px 10px;font-size:11.5px;color:var(--ink2);background:var(--chrome);border-top:1px solid var(--chrome-lo)}
@container (max-width:540px){.cols,.row{grid-template-columns:1fr 86px}.tg{display:none}}

/* Reader */
.rbar{position:relative;flex:none;display:flex;align-items:center;gap:4px;padding:4px 6px;background:linear-gradient(#f6f3ec,#e0dace);border-bottom:1px solid var(--chrome-lo)}
.rbar .sp{flex:1}
.prog{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--teal)}
.read{flex:1;min-height:0;overflow:auto;background:var(--paper);user-select:text;-webkit-user-select:text}
.art{max-width:70ch;margin:0 auto;padding:30px 28px 72px;font:400 calc(1.07rem * var(--fs))/1.72 var(--read);color:#2b2620}
.art h1{font:600 2.05em/1.18 var(--read);margin:.2em 0 .3em;letter-spacing:-.01em}
.art h2{font:700 1.3em/1.3 var(--ui);margin:2em 0 .5em}
.art h3{font:700 1.08em/1.35 var(--ui);margin:1.6em 0 .4em}
.meta{font:13px var(--ui);color:var(--ink2);margin:0 0 10px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:26px}
.tags button{border:1px solid #d3c9b4;background:#f3ede0;border-radius:11px;padding:2px 10px;font:12px var(--ui);min-height:26px}
.tags button:hover{background:#fff3c4;border-color:#d6a526}
.cover{display:block;width:100%;max-height:340px;object-fit:cover;border-radius:6px;border:1px solid #d6cdb9;margin-bottom:18px}
.lede{font-size:1.15em;color:#3b342b}
.go{display:inline-block;margin-top:.6em;padding:9px 16px;border-radius:4px;border:1px solid var(--teal-d);background:linear-gradient(#2e939c,var(--teal));color:#fff;font:600 14px var(--ui);text-decoration:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.art a:not(.go){color:var(--teal-d);text-underline-offset:2px}
.art pre{background:#26221f;color:#efe9dd;padding:14px 16px;border-radius:6px;border:1px solid #000;overflow:auto;font:13px/1.55 var(--mono)}
.art code{font:.86em var(--mono);background:#efe8d8;padding:.1em .35em;border-radius:3px}
.art pre code{background:none;padding:0;font-size:inherit}
.art img{max-width:100%;height:auto;border-radius:6px;border:1px solid #d6cdb9;cursor:zoom-in}
.art table{display:block;overflow-x:auto;border-collapse:collapse;margin:1.2em 0;font:13px var(--ui)}
.art th,.art td{padding:4px 10px;border-bottom:1px solid #e3dccb;text-align:left;white-space:nowrap}
.art th{background:#efe8d8}
.art blockquote{margin:1.2em 0;padding:.6em 1em;border-left:4px solid #d8cfbb;background:#f4efe3;border-radius:0 6px 6px 0}
.art blockquote p{margin:.3em 0}
.art .callout-tip{border-color:var(--teal);background:#e5f1ef}
.art .callout-example{border-color:var(--rust);background:#f8ece3}
.art hr{border:0;border-top:1px solid #ddd3bf;margin:2em 0}
.art li{margin:.25em 0}

/* Terminal (xfce4-terminal, Tango palette) */
.term{flex:1;min-height:0;overflow:auto;padding:8px 10px;background:#1f1c1a;color:#e6e0d4;font:13px/1.5 var(--mono);user-select:text;-webkit-user-select:text}
.ln{white-space:pre-wrap;word-break:break-word}
.c-g{color:#8ae234}.c-b{color:#729fcf}.c-y{color:#fce94f}.c-r{color:#ef2929}.c-m{color:#ad7fa8}.c-c{color:#34e2e2}.c-d{color:#8a8277}
.tl{color:#729fcf;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.tl:hover{color:#fce94f}
.term mark{background:#c4a000;color:#1f1c1a}
.cmdn{display:inline-block;min-width:16ch}
.pl{display:flex;gap:8px}
.pl input{flex:1;min-width:0;padding:0;border:0;outline:0;background:none;color:inherit;font:inherit;caret-color:#fce94f}
.nf{display:flex;flex-wrap:wrap;gap:6px 20px}
.nf pre{margin:0;font:inherit}
.sw{display:inline-block;width:2ch;height:1em;vertical-align:middle}
.chips{flex:none;display:flex;gap:6px;padding:6px;overflow-x:auto;background:linear-gradient(#efebe2,#dcd6c9);border-top:1px solid var(--chrome-lo)}
.chip{flex:none;min-height:30px;padding:3px 11px;border:1px solid var(--chrome-dk);border-radius:15px;background:linear-gradient(#fff,#e4ddd0);font:12px var(--mono);box-shadow:inset 0 1px 0 #fff}
.chip:hover{border-color:var(--teal);color:var(--teal-d)}
@media (pointer:coarse){.pl input,.srch{font-size:16px}}

/* About and ShowImage */
.about{flex:1;min-height:0;display:flex;overflow:auto;background:var(--paper);user-select:text;-webkit-user-select:text}
.aside{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 0;background:linear-gradient(var(--teal),#2c2742);border-right:1px solid var(--line)}
.aside svg{width:36px;height:36px}
.aside b{writing-mode:vertical-rl;transform:rotate(180deg);color:rgba(255,255,255,.9);font:700 20px var(--ui);letter-spacing:.14em}
.amain{padding:18px 24px 30px;max-width:68ch;font-size:14px;line-height:1.6}
.who{display:flex;gap:14px;align-items:center}
.who img{width:88px;height:88px;border-radius:6px;border:2px solid var(--line)}
.who h2{margin:0;font:600 24px var(--read)}
.who p{margin:2px 0 0;color:var(--ink2)}
.amain h3{margin:18px 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.amain ul{margin:0;padding-left:18px}

<template id="b-2026-07-04-agent-skills-common-pitfalls">
<p>I write and review a <em>lot</em> of <a target="_blank" rel="noopener" href="https://code.claude.com/docs/en/skills">Agent</a> <a target="_blank" rel="noopener" href="https://agentskills.io">Skills</a>, and find myself frequently pushing back in reviews, as many authors assume they&#39;re writing &quot;<em>just another markdown prompt</em>&quot; without considering that they&#39;re actually working with one component of an agentic system.</p>
<p>The <strong>TLDR</strong> of my feedback is usually along the lines of:</p><blockquote><ol><li>The descriptions <em>only</em> job is to tell the agent when the skill should be triggered.</li><li>Keep the description as terse as possible while still triggering.</li><li>The SKILL.md should be lean with detail pushed to reference files.</li><li>Put repeatable work in scripts rather than relying on model inference.</li></ol></blockquote>
<hr>
<h2>Skill Creator Primer</h2>
<p>I recommend teams use or create their own version of my <a target="_blank" rel="noopener" href="https://github.com/sammcj/agentic-coding/blob/main/Skills/skill-creator-primer/SKILL.md">skill-creator-primer</a> skill.</p>
<p>The primer works alongside the official Anthropic skill-creator skill and aims to catch common pitfalls and align with best practices.</p>
<blockquote class="callout callout-tip"><p><strong class="callout-t">Proactively use the primer</strong><br>While the primer should activate passively when working with skills, to get the most out of it ask your agent to use it to review your work:</p>
<p><em>&quot;First please activate your skill creator primer skill.</em>
<em>Then, I want you to look at my coworkers PR: <URL to PR or branch></em>
<em>and conduct a critical review.&quot;</em></p></blockquote>
<h2>The top five pitfalls</h2>
<h3>1. Descriptions written as summaries</h3>
<p>The descriptions only job is telling the agent when to load the skill. Summarising the contents invites the agent to act on the summary and skip the skill.</p><ul><li>Roughly 30-55 words, imperative, naming the specific triggers.</li><li>The description should only contain information that is specific to knowing when to trigger the skill.</li><li>Some agents under-trigger, so be slightly assertive while keeping it tight.</li><li>Unsure it fires? Write a handful of trigger evals: realistic prompts labelled should/shouldn&#39;t trigger.</li></ul>
<blockquote class="callout callout-example"><p><strong class="callout-t">Example:</strong><br>description: &#39;You MUST use this skill whenever the user mentions dashboards, monitoring or metrics.&#39;</p></blockquote>
<blockquote class="callout callout-tip"><p><strong class="callout-t">If your skill doesn&#39;t need to be triggered by an agent</strong><br>Set <code>disable-model-invocation: true</code> in the frontmatter so its description isn&#39;t loaded into every session</p></blockquote>
<h3>2. No progressive disclosure</h3>
<p>The main <code>SKILL.md</code> should inline only what every use of the skill needs, regardless of the situation.
Practising progressive disclosure keeps skills lean, reusable and composable.</p>
<p>Other bundled information such as handling for specific scenarios goes in <code>references/&lt;file&gt;.md</code> behind a pointer that says when to read it, e.g:</p>
<blockquote class="callout callout-example"><p><strong class="callout-t">Example:</strong><br>&quot;Step 3: If working on frontend codebase you must first read &#39;references/frontend.md&#39;&quot;</p></blockquote>
<h3>3. Making the model do a script&#39;s job</h3>
<p>If a step is often repeated, deterministic or requires a high degree of accuracy, bundle a small script.</p><ul><li>A script is faster, should provide the same result every run and is testable.</li><li>Favour using Python and its stdlib where possible.</li><li>If you <em>need</em> to add dependencies use <a target="_blank" rel="noopener" href="https://peps.python.org/pep-0723/">PEP-723</a> inline metadata.</li><li>Instruct the agent to run with <code>uv run scripts/my-script.py &lt;args&gt;</code>.</li></ul>
<h3>4. Too much content, too many skills</h3>
<p>Skills are for agents, not humans. Terse wins. The deletion test: cut a line and ask whether the agent&#39;s behaviour would change. If not, it stays cut.</p>
<p>The same can be true for having too many skills (without good reason to do so) - especially if the descriptions aren&#39;t tight, focused or well differentiated. Favour one skill with progressive disclosure (references for each scenario) over lots of smaller but related skills.</p>
<h3>5. Stepped workflows with no structure</h3>
<p>For workflows that must be followed within a skill:</p><ul><li>Instruct the agent to track each step.</li><li>Number the steps.</li><li>Trigger a review after all steps are complete.</li></ul>
<blockquote class="callout callout-example"><p><strong class="callout-t">Example:</strong><br>Create and track a task / TODO for each step:</p><ol><li>Do x</li><li>Do y</li><li>Do z</li></ol>
<p>Once all steps are completed conduct a critical review of the work and make any necessary corrections.</p></blockquote>
<p>Agents drift and finish early on long procedures; a visible checklist stops that. The same is true if your skill instructs the agent to task sub-agents with their own workflows.</p>
<h2>General tips</h2><ul><li>Don&#39;t wrap text in markdown - manual line breaks mean more lines for the agent to read in.</li><li>For reference files over ~100 lines, add a simple TOC near the top (but not in the main <code>SKILL.md</code>).</li><li>If your skill is very complex, add an <code>AGENTS.md</code> / <code>CLAUDE.md</code> in its root to help you and others maintain it.</li><li>A single entry point for interacting with your software project (<code>make lint</code>, <code>make test</code>, <code>make build</code>, <code>make run</code>, etc.) makes it easy for agents and skills to do the right thing everywhere.</li></ul>
<h2>A note on Agent Skills vs Custom Agents</h2><ul><li>Custom Agents:<ul><li>Can be thought of as a &quot;persona&quot;, think as if you were asked to put yourself in someone else&#39;s shoes.</li><li>May include workflows / ways of working but keep it light and instead have them use skills.</li><li>Good for adversarial tasks as they get their own context and world view.</li><li>Operate within their own context (usually).</li></ul></li><li>For knowledge, detailed workflows, helper tools etc., favour Skills over Custom Agents.</li><li>Skills are powerful as they&#39;re composable and often portable.</li><li>If you need a custom agent and want it to be read-only, set <code>permissionsMode: plan</code> in its frontmatter.</li><li>There&#39;s no need to create a custom agent for normal development tasks - that&#39;s what the main / general agent is for.</li></ul>
<h2>Review signals</h2>
<p>Quick tells that a skill wasn&#39;t reviewed carefully:</p><ul><li>Descriptions that have information not specific to knowing when to trigger the skill.</li><li>Descriptions that are more than 1-3 tight sentences - if it looks like a paragraph, it probably hasn&#39;t been thought through.</li><li>Overly verbose, long form prose in the body of the skill or resources.</li><li>Getting agents to do the work of scripts, have them write and drive the scripts instead.</li><li><em>&quot;When to use&quot;</em> in the body - if the agent is reading that, it&#39;s too late. It&#39;s also a sign the author may not have understood what they were creating.</li></ul>
<h2>Security tips</h2>
<p>Treat third party skills as you would any other software or library obtained from the internet - don&#39;t blindly install them without first reviewing their content.</p><ul><li>Skills can include both prompts (<code>SKILL.md</code>, references) and scripts, review the markdown for malicious or risky instructions that could mislead the agent.</li><li>If the skill contains scripts, consider running dependency and SAST scanning tools (e.g. SonarQube) across the content.</li><li>When writing scripts within skills, aim to use the standard library where possible.</li><li>Apply the principle of least privilege in the frontmatter configuration - does the skill really need web search or write tools?</li><li>Where possible, run your agentic coding tool in a sandbox.</li></ul>
</template>
<template id="b-2025-08-26-mcp-tool-disabling">
<p><strong>TLDR</strong>: If you&#39;re building MCP servers, let users disable individual tools. It&#39;s simple to implement and your context window will thank you.</p>
<p><img loading="lazy" src="../content/posts/2025-08-26-mcp-tool-disabling/tool-context-usage.png" alt="alt text"></p>
<p>Agents often don&#39;t need <em>every</em> tool a MCP server provides. Allowing individual tools to be disabled can not just vastly improve token usage, it aids with tool use reliability, the quality of the model&#39;s output and your security posture.</p><ul><li><strong>Optimises context use</strong> by reducing token count when running many MCP servers</li><li><strong>Reduces <a target="_blank" rel="noopener" href="https://research.trychroma.com/context-rot">context rot</a></strong> - we know that model performance grows increasingly unreliable as input length grows and that irrelevant information acts as distractors that degrade performance</li><li><strong>Improves security posture</strong> by reducing attack surface - disable risky operations in production while keeping read-only tools available</li><li><strong>Enables finer-grained control</strong> over tool access for organisational compliance</li></ul>
<p>Want the AWS Terraform server but you don&#39;t use Terragrunt? Disable the Terragrunt tool (save 1.1k tokens). Want web search but not video and maps search? Disable the maps and video tools.</p>
<h2>The Problem is Real</h2>
<p>MCP servers add invaluable capabilities to LLMs and agents, however - unchecked the impact of their many tools quickly becomes apparent.</p>
<p>The numbers are worse than you think:</p>
<table><thead>
<tr><th>MCP Server</th><th>Tool Name</th><th>Tokens</th></tr>
</thead><tbody><tr><td><strong>AWS Terraform</strong></td><td></td><td><strong>6.4k</strong> (7 tools)</td></tr>
<tr><td></td><td>ExecuteTerragruntCommand</td><td>1.1k</td></tr>

<p><strong>That&#39;s over 32k tokens <em>just for tool descriptions &amp; annotations</em> - before you&#39;ve written a line of code.</strong></p>
<p>Individual tools range from lightweight (387 tokens for basic memory operations) to massive (2.7k tokens for AWS&#39;s documentation generator). The AWS Cost Explorer&#39;s <code>get_cost_and_usage</code> tool alone burns 2.2k tokens describing parameters you might never use.</p>
<p>Fortunately, implementing selective tool disabling is straightforward and the benefits are immediate.</p>
<h2>Implementation Advice</h2>
<p>Start simple. The conditional registration approach requires minimal code and covers most use cases. If you need runtime flexibility later, you can always refactor to a registry pattern.</p><ul><li><strong>Parse once</strong>: Process environment variables at startup, not per-request</li><li><strong>Normalise input</strong>: Handle whitespace, case variations, and naming conventions (<code>underscore_tool</code> vs <code>hyphen-tool</code>)</li><li><strong>Use map lookups</strong>: <code>O(1)</code> performance with <code>map[string]bool</code> over slice iteration</li><li><strong>Case insensitivity</strong>: Match both <code>ToolName</code> and <code>toolname</code></li><li><strong>Whitespace</strong>: <code>&quot; tool1 , tool2 &quot;</code> should be equivalent to <code>&quot;tool1,tool2&quot;</code></li><li><strong>Empty strings</strong>: <code>DISABLED_TOOLS=&quot;,tool1,,tool2,&quot;</code> should work</li><li><strong>Non-existent tools</strong>: Disabling <code>&quot;non-existent_tool&quot;</code> shouldn&#39;t break anything</li><li><strong>Fail gracefully</strong>: Invalid tool names shouldn&#39;t crash your server</li></ul>
<h2>Example Implementation Approaches</h2>
<p>I&#39;ve implemented tool disabling in both my <a target="_blank" rel="noopener" href="https://github.com/sammcj/mcp-devtools">mcp-devtools server</a> with a registry based approach,and recently raised a <a target="_blank" rel="noopener" href="https://github.com/awslabs/mcp/pull/1178">PR to AWS&#39;s MCP servers</a> with a simpler conditional utility. Both work well and take slightly different approaches.</p>
<h3>Simple Conditional Registration</h3>
<p>In my <a target="_blank" rel="noopener" href="https://github.com/awslabs/mcp/pull/1178">PR</a> to AWS&#39;s MCP servers, I used straightforward conditional registration. Here&#39;s the pattern:</p>
<pre><code class="language-python">from awslabs.common.config import tool_enabled
if tool_enabled(&#39;ExecuteTerraformCommand&#39;):
    @mcp.tool(name=&#39;ExecuteTerraformCommand&#39;)
    async def execute_terraform_command(...):
        # existing implementation unchanged
</code></pre>
<p>The utility function parses a comma-separated environment variable:</p>
<pre><code class="language-python">def disabled_tools() -&gt; Set[str]:
    disabled_tools = os.environ.get(&#39;DISABLED_TOOLS&#39;, &#39;&#39;)
    if not disabled_tools:
        return set()
    return {tool.strip() for tool in disabled_tools.split(&#39;,&#39;) if tool.strip()}
def tool_enabled(tool_name: str) -&gt; bool:
    return tool_name not in disabled_tools()
</code></pre>
<p>Configuration is simple:</p>
<pre><code class="language-json">{
  &quot;env&quot;: {
    &quot;DISABLED_TOOLS&quot;: &quot;ExecuteTerraformCommand,RunCheckovScan&quot;
  }
}
</code></pre>
<h3>Registry-Based Runtime Filtering</h3>
<p>My <a target="_blank" rel="noopener" href="https://github.com/sammcj/mcp-devtools">MCP DevTools</a> server uses a more sophisticated approach with runtime filtering:</p>
<pre><code class="language-go">// Tools register normally during init
func init() {
    registry.Register(&amp;ThinkTool{})
}
// But filtering happens at retrieval
func GetTool(name string) (tools.Tool, bool) {
    if disabledFunctions[name] {
        return nil, false
    }
    return toolRegistry[name], true
}
</code></pre>
<p>This approach allows for more complex filtering logic and better separation of concerns. The trade-off is slightly more implementation complexity.</p>
<h2>Just Do It</h2>
<p>Having a pattern for selective tool disabling is something I now add to all MCP servers that I develop and recommend to others. The implementation effort is minimal, but the user value - and performance improvement - is significant.</p>
<p>If you&#39;re maintaining an MCP server, add this feature. Your users are already thinking about their token budgets and context quality - help them optimise both.</p>
<hr>
<h2>Appendix - A Note On The Worst Offender: Github</h2>
<p>GitHub&#39;s MCP server is a masterclass in context pollution.</p>
<p>Where other servers hover around 3-10k tokens, <strong>The GitHub MCP consumes a staggering 46k tokens across 91 different tools</strong> that cannot be individually enabled or disabled. GitHub alone consumes nearly a quarter of Claude Sonnet / Opus 4&#39;s context window - before you even write a single line of code.</p><blockquote>
<p><em>For comparison - <a target="_blank" rel="noopener" href="https://github.com/sammcj/mcp-devtools">MCP-DevTools</a> provides the most useful GitHub functionality in just 1.6k tokens with a single tool.</em></p></blockquote>
<p>Github&#39;s MCP fails to:</p><ul><li>Group functionality into broader tools (e.g. <code>list_issues</code>, <code>search_issues</code>, <code>update_issue</code> could be a single <code>issue_management</code> tool).</li><li>Keep tool description and parameter annotations concise.</li><li>Provide any mechanism to only enable individual tools.</li></ul>

function workArea() { return { w: innerWidth - (mobile() ? 0 : BAR + 12), h: innerHeight }; }

// Pointer-driven drag that works identically for mouse, pen and touch
function drag(e, move, end) {
  e.preventDefault();
  const t = e.currentTarget, sx = e.clientX, sy = e.clientY;
  t.setPointerCapture(e.pointerId);
  const mv = ev => move(ev.clientX - sx, ev.clientY - sy);
  const up = ev => {
    t.removeEventListener('pointermove', mv); t.removeEventListener('pointerup', up); t.removeEventListener('pointercancel', up);
    if (end) end(ev.type === 'pointercancel');
  };
  t.addEventListener('pointermove', mv); t.addEventListener('pointerup', up); t.addEventListener('pointercancel', up);
}

function openWin(o) {
  let w = wins.get(o.id);
  if (w) { restore(w); return w; }
  const el = document.createElement('div');
  el.className = 'win new';
  el.innerHTML = `<div class="tab"><button class="wb close" aria-label="Close"></button><span class="ttl"></span><button class="wb mini" aria-label="Minimise"></button><button class="wb zoom" aria-label="Zoom"></button></div><div class="frame"><div class="body"></div><div class="knob"></div></div>`;
  $('.ttl', el).textContent = o.title;
  w = { id: o.id, app: o.app, title: o.title, el, body: $('.body', el), min: false, prev: null };
  setRect(w, o.rect || cascade(o.w || 560, o.h || 440));
  desk.appendChild(el);
  wins.set(o.id, w);
  o.build(w.body, w);
  wire(w);
  focus(w);
  el.addEventListener('animationend', () => el.classList.remove('new'), { once: true });
  return w;
}

function wire(w) {
  const el = w.el, tab = $('.tab', el);
  el.addEventListener('pointerdown', () => focused !== w && focus(w), true);
  $('.close', el).onclick = () => closeWin(w);
  $('.mini', el).onclick = () => minimise(w);
  $('.zoom', el).onclick = () => zoom(w);
  let lastTap = 0;
  tab.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || e.button > 0) return;
    const r = getRect(w);
    let moved = false;
    drag(e, (dx, dy) => {
      if (!moved && Math.hypot(dx, dy) < 5) return;
      moved = true;
      if (mobile()) return;
      setRect(w, { ...r, x: Math.min(Math.max(r.x + dx, 60 - r.w), innerWidth - 80), y: Math.min(Math.max(r.y + dy, 0), innerHeight - 40) });
      updateDock();
    }, cancelled => {
      if (moved || cancelled) return;
      // Double-tap on the yellow tab rolls the window up (window shade)
      const now = Date.now();
      if (now - lastTap < 350) { lastTap = 0; el.classList.toggle('shaded'); updateDock(); } else lastTap = now;
    });
  });
  $('.knob', el).addEventListener('pointerdown', e => {
    const r = getRect(w);
    drag(e, (dx, dy) => { setRect(w, { ...r, w: Math.max(280, r.w + dx), h: Math.max(180, r.h + dy) }); updateDock(); });
  });
}

function topWin() { return [...wins.values()].filter(x => !x.min).sort((a, b) => b.el.style.zIndex - a.el.style.zIndex)[0] || null; }
function focus(w) {

function closeWin(w) {

}
function minimise(w) {
  if (w.min) return;
  w.min = true;
  const b = w.el.getBoundingClientRect();
  const tx = mobile() ? 0 : innerWidth - BAR / 2 - (b.left + b.width / 2), ty = (mobile() ? innerHeight : 60) - (b.top + b.height / 2);
  w.el.animate([{ transform: 'none', opacity: 1 }, { transform: `translate(${tx}px,${ty}px) scale(.12)`, opacity: 0 }], { duration: 220, easing: 'ease-in' })
    .finished.then(() => {
      if (!w.min) return;
      w.el.classList.add('min');
      if (focused === w) { w.el.classList.remove('focus'); focused = null; focus(topWin()); } else sync();

    id: 'post:' + slug, app: 'reader', title: p.title, rect: bigRect(), build: b => {
      b.innerHTML = `<div class="rbar"><button class="xb" data-fs="-0.08" aria-label="Smaller text">A-</button><button class="xb" data-fs="0.08" aria-label="Larger text">A+</button><span class="sp"></span><a class="xb" href="${p.url}" target="_blank" rel="noopener">${ico('globe')}View on smcleod.net</a><i class="prog"></i></div>
        <div class="read"><article class="art"><header>${!tpl && p.cover ? `<img class="cover" src="${p.cover}" alt="">` : ''}<h1>${esc(p.title)}</h1>
        <p class="meta">${fmtDate(p.date)}${words ? ` · ${Math.ceil(words / 230)} min read` : ''}</p>
        <div class="tags">${p.tags.map(t => `<button data-q="${esc(t)}">${esc(t)}</button>`).join('')}</div></header><div class="content"></div></article></div>`;
      const content = $('.content', b), read = $('.read', b), prog = $('.prog', b);
      if (tpl) content.appendChild(tpl.content.cloneNode(true));
      else content.innerHTML = `<p class="lede">${esc(p.desc || 'No summary for this one, the post speaks for itself.')}</p><p><a class="go" href="${p.url}" target="_blank" rel="noopener">Read the full post on smcleod.net</a></p>`;
      read.onscroll = () => { prog.style.width = (read.scrollTop / Math.max(1, read.scrollHeight - read.clientHeight) * 100) + '%'; };
      b.addEventListener('click', e => {
        if (e.target.dataset.fs) setFs(+e.target.dataset.fs);
        const img = e.target.closest('.content img');
        if (img) openViewer(img.src, img.alt || 'image');
      });
    }
  });
}

function openViewer(src, name) {
  openWin({
    id: 'view:' + src, app: 'view', title: name, w: 700, h: 560, build: b => {
      b.innerHTML = `<div class="view"><img alt="${esc(name)}"></div><div class="stat">Loading ${esc(name)}</div>`;
      const img = $('img', b), st = $('.stat', b);
      img.onload = () => st.textContent = `${name}  ·  ${img.naturalWidth} x ${img.naturalHeight}`;
      img.onerror = () => st.textContent = `Could not load ${name}`;
      img.src = src;
    }
  });
}

// ---------- Terminal ----------
const PS1 = '<span class="c-g">sam@smcleod</span>:<span class="c-b">~</span>$';
const CHIPS = ['help', 'ls', 'ls posts', 'whoami', 'neofetch', 'cat ' + POSTS[0].slug, 'grep mcp', 'grep quantisation', 'date', 'clear'];
const tl = (cmd, label, cls = '') => `<span class="tl ${cls}" data-cmd="${esc(cmd)}">${esc(label)}</span>`;
const CAT = [String.raw`    /\_/\  `, String.raw`   ( o.o ) `, String.raw`    > ^ <  `, String.raw`   /     \ `, String.raw`  (|     |)`, String.raw`   \_____/ `];

function openTerm() {
  openWin({
    id: 'term', app: 'term', title: 'sam@smcleod: ~', w: 700, h: 460, build: (b, w) => {
      b.innerHTML = `<div class="term"><div class="out"></div><label class="pl"><span>${PS1}</span><input aria-label="Command" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label></div>
        <div class="chips">${CHIPS.map(c => `<button class="chip" data-cmd="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
      const T = { out: $('.out', b), inp: $('input', b), scr: $('.term', b), hist: [], hi: 0, w };
      out(T, `<span class="c-d">smcleod.net tty1. Tap a command below or type one.</span> ${tl('help', 'help')} <span class="c-d">lists them all.</span>`);
      T.inp.addEventListener('keydown', e => {
        if (e.key === 'Enter') { run(T, T.inp.value); T.inp.value = ''; }
        else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
          e.preventDefault();
          T.hi = Math.max(0, Math.min(T.hist.length, T.hi + (e.key === 'ArrowUp' ? -1 : 1)));
          T.inp.value = T.hist[T.hi] || '';
        }
      });
      b.addEventListener('click', e => {
        const c = e.target.closest('[data-cmd]');
        if (c) run(T, c.dataset.cmd);
        else if (!coarse() && !getSelection().toString()) T.inp.focus();
      });
      if (!coarse()) T.inp.focus();
    }
  });
}
const out = (T, html) => T.out.insertAdjacentHTML('beforeend', `<div class="ln">${html}</div>`);
function run(T, raw) {
  const cmd = raw.trim();
  out(T, `${PS1} ${esc(cmd)}`);
  if (cmd) {
    T.hist.push(cmd); T.hi = T.hist.length;
    const [c, ...rest] = cmd.split(/\s+/);
    const f = CMDS[c];
    if (f) f(T, rest.join(' ')); else out(T, `<span class="c-r">${esc(c)}: command not found.</span> Try ${tl('help', 'help')}.`);
  }
  T.scr.scrollTop = T.scr.scrollHeight;
}
const CMDS = {
  help: T => out(T, [['ls [posts]', 'list files, or every post'], ['cat <slug>', 'open a post in the reader'], ['grep <term>', 'search titles, descriptions and tags'], ['find <term>', 'show matches in Tracker'], ['whoami', 'who owns this machine'], ['neofetch', 'system facts'], ['date', 'the time in Melbourne'], ['clear', 'clear the screen'], ['exit', 'close the terminal']]
    .map(([a, d]) => `  <span class="c-y cmdn">${esc(a)}</span>${d}`).join('\n')),
  ls: (T, a) => {
    if (!a) return out(T, `${tl('ls posts', 'posts/', 'c-b')}  ${tl('cat about.txt', 'about.txt')}  ${tl('cat piper.jpg', 'piper.jpg', 'c-m')}`);
    if (/^posts\/?$/.test(a)) return out(T, `<span class="c-d">${POSTS.length} posts, newest first. Tap one to open it.</span>\n` + POSTS.map(p => `<span class="c-d">${p.date}</span>  ${tl('cat ' + p.slug, p.slug)}`).join('\n'));
    out(T, `ls: cannot access '${esc(a)}': No such file or directory`);
  },
  cat: (T, a) => {
    if (!a) return out(T, `usage: cat &lt;slug&gt;  (try ${tl('ls posts', 'ls posts')})`);
    a = a.replace(/^posts\//, '').toLowerCase();
    if (a === 'about.txt') { launch.about(); return out(T, 'Opened about.txt in About.'); }
    if (a === 'piper.jpg') { launch.piper(); return out(T, 'cat: piper.jpg: binary file. Opened it in ShowImage instead.'); }
    const exact = POSTS.filter(p => p.slug.toLowerCase() === a || p.id.toLowerCase() === a);
    const pre = POSTS.filter(p => p.slug.toLowerCase().startsWith(a));
    const hits = exact.length ? exact : pre.length ? pre : POSTS.filter(p => p.slug.toLowerCase().includes(a));
    if (hits.length === 1) { openPost(hits[0].slug); return out(T, `Opening <span class="c-c">${esc(hits[0].title)}</span>`); }
    if (hits.length > 1) return out(T, `cat: '${esc(a)}' matches ${hits.length} posts:\n` + hits.slice(0, 15).map(p => '  ' + tl('cat ' + p.slug, p.slug)).join('\n'));
    out(T, `cat: ${esc(a)}: No such file or directory. Try ${tl('grep ' + a, 'grep ' + a)}.`);
  },
  grep: (T, a) => {
    if (!a) return out(T, 'usage: grep &lt;term&gt;');
    const hits = POSTS.filter(p => matches(p, a));
    const re = new RegExp('(' + esc(a.split(/\s+/)[0]).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    out(T, `<span class="c-d">${hits.length} match${hits.length === 1 ? '' : 'es'} for '${esc(a)}'</span>\n` + hits.slice(0, 25).map(p =>
      `<span class="c-d">${p.date}</span>  ${tl('cat ' + p.slug, p.slug)}\n            ${esc(p.title).replace(re, '<mark>$1</mark>')}`).join('\n') +
      (hits.length > 25 ? `\n<span class="c-d">...and ${hits.length - 25} more.</span> ${tl('find ' + a, 'find ' + a)}` : ''));
  },
  find: (T, a) => { openPosts(a || ''); out(T, `Showing matches for '${esc(a)}' in Tracker.`); },
  whoami: T => out(T, `sam\n<span class="c-d">Sam McLeod. AI engineer, open source contributor and music geek based in Melbourne, Australia.</span>`),
  neofetch: T => {
    const facts = [
      `<span class="c-g">sam</span>@<span class="c-g">smcleod.net</span>`, '-----------------',
      ['Role', 'AI Engineering Principal, Mantel'], ['Location', 'Melbourne, Australia'], ['Uptime', 'around 20 years in tech'],
      ['Focus', 'LLMs and AI, the last five years'], ['Background', 'platform engineering, technical leadership'],
      ['Posts', `${POSTS.length} (${Y0} to ${Y1})`], ['Top tags', topTags.slice(0, 4).map(t => t[0]).join(', ')],
      ['Interests', 'music, gigs, HiFi, cats (Piper), road trips'], ['Energy', 'remote work, open communication'], ''
    ].map(f => Array.isArray(f) ? `<span class="c-y">${f[0]}</span>: ${esc(f[1])}` : f).join('\n');
    const sw = ['#2e3436', '#cc0000', '#4e9a06', '#c4a000', '#3465a4', '#75507b', '#06989a', '#d3d7cf'].map(c => `<span class="sw" style="background:${c}"></span>`).join('');
    out(T, `<div class="nf"><pre class="c-y">${esc(CAT.join('\n'))}</pre><div>${facts}\n${sw}</div></div>`);
  },
  date: T => out(T, new Date().toLocaleString('en-AU', { timeZone: TZ, dateStyle: 'full', timeStyle: 'long' })),
  clear: T => { T.out.innerHTML = ''; },
  exit: T => closeWin(T.w),
  sudo: T => out(T, 'sam is not in the sudoers file. This incident will be reported.')
};

// ---------- Desktop replicants ----------
let li = 0;
const LN = 5;
function renderLatest() {
  const p = POSTS[li];
  $('#lp-n').textContent = `${li + 1} of ${LN}`;
  $('#lp').innerHTML = `<button class="lp-card" data-p="${esc(p.slug)}">${p.cover ? `<span class="lp-cover" style="background-image:url('${p.cover}')"></span>` : `<span class="lp-cover none">${ico('doc')}</span>`}
    <span class="lp-body"><small>${fmtDate(p.date)}</small><strong>${esc(p.title)}</strong><span>${esc(p.desc)}</span></span></button>
    <nav class="lp-nav"><button class="xb" data-lp="-1"${li ? '' : ' disabled'}>Newer</button><button class="xb" data-lp="1"${li < LN - 1 ? '' : ' disabled'}>Older</button></nav>`;
}
function renderPulse() {
  const ys = [];
  for (let y = Y0; y <= Y1; y++) ys.push([y, years[y] || 0]);
  const max = Math.max(...ys.map(v => v[1])), W = 280, H = 84, bw = W / ys.length;
  const peak = ys.find(v => v[1] === max);
  const days = Math.floor((Date.now() - new Date(POSTS[0].date + 'T12:00:00')) / 864e5);
  const bars = ys.map(([y, n], i) => {
    const h = n ? Math.max(3, n / max * (H - 10)) : 1;
    return `<g data-q="${y}" data-n="${n}"><rect x="${i * bw}" width="${bw}" height="${H}" fill="transparent"/><rect class="bar${y === Y1 ? ' cur' : ''}" x="${i * bw + 2}" y="${H - h}" width="${bw - 4}" height="${h}" rx="1.5"/></g>`;
  }).join('');
  const grid = [.25, .5, .75].map(f => `<line x1="0" x2="${W}" y1="${H * f}" y2="${H * f}"/>`).join('');
  $('#pulse').innerHTML = `<div class="kpis"><div><b>${POSTS.length}</b><span>posts</span></div><div><b>${Y1 - Y0 + 1}</b><span>years</span></div><div><b>${days}d</b><span>since last post</span></div></div>
    <svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Posts per year ${Y0} to ${Y1}">${grid}${bars}</svg>
    <div class="axis"><span>${Y0}</span><span>${Y1}</span></div><div class="ro"></div>
    <div class="tops">${topTags.map(([t, n]) => `<button data-q="${esc(t)}"><span>${esc(t)}</span><i style="width:${n / topTags[0][1] * 100}%"></i><b>${n}</b></button>`).join('')}</div>`;
  const ro = $('#pulse .ro'), def = `Busiest year <b>${peak[0]}</b> with ${peak[1]} posts. Tap a bar to list.`;
  ro.innerHTML = def;
  const svg = $('#pulse .spark');
  svg.addEventListener('pointerover', e => { const g = e.target.closest('g'); if (g) ro.innerHTML = `<b>${g.dataset.q}</b>: ${g.dataset.n} post${g.dataset.n === '1' ? '' : 's'}`; });
  svg.addEventListener('pointerleave', () => { ro.innerHTML = def; });
}
let qi = 0;
function renderQuote() { const [q, who] = QUOTES[qi]; $('#quote').innerHTML = `<q>${esc(q)}</q><cite>${esc(who)}</cite>`; }
$('#quote').onclick = () => { qi = (qi + 1) % QUOTES.length; renderQuote(); };

function layoutReps() {
  if (mobile()) return;
  // Stack widgets beside the Deskbar, wrapping to a new column leftwards when one would run off the bottom
  let x = innerWidth - BAR - 24 - 300, y = 12;
  document.querySelectorAll('.rep').forEach(r => {
    if (y > 12 && y + r.offsetHeight > innerHeight - 16) { x -= 318; y = 12; }
    if (!r.dataset.moved) { r.style.left = Math.max(120, x) + 'px'; r.style.top = y + 'px'; }
    y += r.offsetHeight + 18;
  });
}
document.querySelectorAll('.rep .grab').forEach(g => g.addEventListener('pointerdown', e => {
  if (mobile()) return;
  const rep = g.parentElement, x = rep.offsetLeft, y = rep.offsetTop;
  rep.dataset.moved = 1;
  drag(e, (dx, dy) => {
    rep.style.left = Math.min(Math.max(x + dx, 0), innerWidth - 60) + 'px';
    rep.style.top = Math.min(Math.max(y + dy, 0), innerHeight - 40) + 'px';
  });
}));

// ---------- Global wiring ----------
document.addEventListener('click', e => {
  const t = e.target.closest('[data-open],[data-p],[data-q],[data-w],[data-lp]');
  if (!t) return;
  const d = t.dataset;
  if (d.open) launch[d.open]();
  else if (d.p) openPost(d.p);
  else if (d.q) openPosts(d.q);
  else if (d.w) teamClick(d.w);
  else if (d.lp) { li = Math.min(LN - 1, Math.max(0, li + +d.lp)); renderLatest(); }
  setMenu(false);
  if (t.closest('#dock')) setPeek(false);
});
document.addEventListener('pointerdown', e => {
  if (!menu.hidden && !e.target.closest('#menu,#leaf')) setMenu(false);
  if (peek && !e.target.closest('#dock,#grip')) setPeek(false);
});
addEventListener('resize', () => {
  if (!mobile()) wins.forEach(w => { const r = getRect(w); setRect(w, { ...r, x: Math.min(r.x, innerWidth - 80), y: Math.min(r.y, innerHeight - 40) }); });
  layoutReps();
  updateDock();
});

document.documentElement.style.setProperty('--fs', +localStorage.getItem('fs') || 1);
tick();
setInterval(tick, 10000);
renderLatest();
renderPulse();
renderQuote();
renderTeams();
layoutReps();
document.fonts.ready.then(layoutReps);
const start = decodeURIComponent(location.hash.slice(1));
if (bySlug[start]) openPost(start);
else if (!mobile()) openPosts();
updateDock();
</script>
</body>
