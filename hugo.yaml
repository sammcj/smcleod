baseURL: https://smcleod.net
locale: en-GB
title: smcleod.net
gitRepo: "https://github.com/sammcj/smcleod/tree/main"
extended: true
module:
  imports:
    - path: github.com/sammcj/smcleod/deskbar
    - path: github.com/KKKZOZ/hugo-admonitions
  # A mount replaces the default for its target, so static is listed again. The theme concept sheet from the
  # redesign is published as /design/theme-concepts.html, linked from About this desktop.
  mounts:
    - { source: static, target: static }
    - { source: spikes, target: static/design, files: [theme-concepts.html] }
pagination.pagerSize: 150
enableEmoji: true
enableGitInfo: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

# resources.GetRemote responses (the Feeds app's feeds, remote images) are refetched after this, so local builds see
# new posts. The default keeps the first copy for ever. CI starts with an empty cache on every run.
caches:
  getresource:
    maxAge: 6h

params:
  deskbar:
    timeZone: Australia/Melbourne
    # minutes without input before the screen saver starts (never over a reader window); 0 turns it off
    screensaver: { minutes: 1 }
    # Feeds app: subscriptions are assets/feeds.opml (a NetNewsWire export as is); exclude drops feeds by xmlUrl
    feeds:
      perFeed: 5
      exclude: ["https://hnrss.org/replies?id=smcleod"]
    favicon: /favicon-32x32.png
    stylesheets:
      - "https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans:wght@400;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap"
    icons:
      - { name: Posts, url: /posts/, icon: folder }
      - { page: /photos }
      - { page: /tools }
      - { page: /favourites }
      - { page: /projects }
      - { name: About, url: /about/, icon: person }
      - { page: /control-panel }
      - { page: /chiptunes }
    dock:
      - { page: /tools }
      - { name: Posts, url: /posts/, icon: folder }
      - { page: /photos }
      - { name: About, url: /about/, icon: person }
      - { page: /control-panel }
      - { name: GitHub, url: "https://github.com/sammcj", icon: git }
    # Panel tray; RSS is added after these
    tray:
      - { name: About, url: /about/, icon: person }
      - { name: GitHub, url: "https://github.com/sammcj/", icon: github }
      - { name: LinkedIn, url: "https://www.linkedin.com/in/sammcj/", icon: linkedin }
    # Generated thumbnail emblem (the theme's data/deskbar/emblems.yaml) by tag or category; the first matching rule
    # wins, so specific subjects come before broad ones. Posts with a bespoke cover set thumbnailIcon instead.
    thumbRules:
      - { emblem: car, keywords: [cars, car, bmw, automotive] }
      - { emblem: camera, keywords: [photos, photography] }
      - { emblem: record, keywords: [music, gigs, audio] }
      - { emblem: house, keywords: [homeassistant, home assistant, iot, esp32, co2] }
      - { emblem: plug, keywords: [mcp] }
      - { emblem: windows, keywords: [agentic coding, agentic-coding, agentic, agents, cline, roo code, claude code, claude-code, vibe coding, vibecoding, skills] }
      - { emblem: gpu, keywords: [gpu, nvidia, cuda, vram] }
      - { emblem: padlock, keywords: [security, privacy, security-privacy] }
      - { emblem: palette, keywords: [art, stablediffusion] }
      - { emblem: container, keywords: [docker, containers, kubernetes, k8s, xen, xcp-ng, virtualisation] }
      - { emblem: disk, keywords: [storage, san, ssd, nas, zfs, iscsi, nvme, ceph, drbd, glusterfs] }
      - { emblem: screen, keywords: [talk, talks, slides, presentation, keynote, brownbag, video] }
      - { emblem: briefcase, keywords: [jobs] }
      - { emblem: chart, keywords: [data, dashboard, monitoring, benchmarking, finance, budgeting] }
      - { emblem: branch, keywords: [git, github, gitlab] }
      - { emblem: terminal, keywords: [zsh, bash, shell, scripting, cli] }
      - { emblem: code, keywords: [programming, code, coding, golang, go, javascript, typescript, python, rust, yaml, markdown, software development] }
      - { emblem: neural, keywords: [ai, llm, llms, ml, machinelearning, machine-learning, ollama, claude, anthropic, llama, gguf, quantisation, inference] }
      - { emblem: globe, keywords: [networking, network, dns, vpn] }
      - { emblem: laptop, keywords: [apple, mac, macos, osx, macbook, ios] }
      - { emblem: server, keywords: [linux, fedora, centos, systemd] }
      - { emblem: chip, keywords: [hardware, cpu, electronics] }
      - { emblem: board, keywords: [devops, agile, kanban, delivery, cicd, ci, estimating] }
      - { emblem: briefcase, keywords: [career, work, enterprise] }
      - { emblem: chat, keywords: [culture, leadership, communication, values, remotework, sales, marketing] }
      - { emblem: window, keywords: [software, bestof, tools] }
    # Menu groups after the built-in Writing group. `page` entries are left out until the page exists, and a
    # group's own page is its app (Applications and Photos link there once built). A group's `icon` (else its page's,
    # else a folder) shows beside its name.
    menu:
      - name: Applications
        page: /tools
        items:
          - { page: /agentic-coding-tools }
          - { page: /vram-estimator }
          - { page: /tools/tiers }
          - { page: /tools/quantisation-dashboard }
          - { page: /tools/ai-consumption }
          - { page: /terminal }
          - { page: /screensaver }
          - { page: /sketch }
          - { page: /chiptunes }
          - { page: /feeds }
      - name: Photos
        page: /photos
      - name: Pages
        items:
          - { page: /about, icon: person }
          - { page: /cv, icon: doc }
          - { page: /contact }
          - { page: /favourites }
          - { page: /projects }
          - { page: /gigs, icon: image }
          - { page: /cars, icon: image }
          - { page: /quotes, icon: doc }
          - { page: /llm-faq, icon: doc }
      - name: System
        icon: control-panel
        items:
          - { page: /control-panel }
          - { page: /about-desktop }
  # description, author and images feed the RSS template and Hugo's embedded opengraph/twitter cards.
  description: "The personal blog of Sam McLeod."
  author: Sam McLeod
  images: ["/og-card.jpg"]
  social:
    github: "sammcj"
    linkedin: "sammcj"

